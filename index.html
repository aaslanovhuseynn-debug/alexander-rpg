*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18321b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%}#hud,#title,#quest{position:fixed;z-index:20;background:#07100ddd;border:1px solid #d5dfc788;border-radius:12px;padding:8px 11px;text-shadow:1px 1px #000;pointer-events:none;font-size:12px}#hud{left:9px;top:max(8px,env(safe-area-inset-top));line-height:1.45}#title{right:9px;top:max(8px,env(safe-area-inset-top));font-weight:900}#quest{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);font-weight:900;white-space:nowrap}#buttons{position:fixed;z-index:30;right:9px;bottom:max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:9px;width:min(250px,45vw)}button{border:1px solid #cbd7c5;background:#172219ee;color:#fff;border-radius:13px;padding:10px 7px;font-weight:900;font-size:12px;box-shadow:0 5px 14px #0008}button:active{transform:scale(.95);background:#3d523e}#joy{position:fixed;z-index:30;left:12px;bottom:max(13px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid #dce8d655;background:#07100b88}#knob{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#e2ebddaa;border:1px solid #fff8}#toast{position:fixed;z-index:60;left:50%;top:28%;transform:translate(-50%,-10px);padding:9px 13px;background:#050805ef;border:1px solid #d2dec9aa;border-radius:10px;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.show{opacity:1!important;transform:translate(-50%,0)!important}#panel{position:fixed;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:#020403e8;padding:18px}#panel.show{display:flex}.card{width:min(590px,94vw);max-height:87vh;overflow:auto;background:#1b241d;border:1px solid #bac8b4;border-rad </style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="title">ALEXANDER RPG • BETA 15</div><div id="quest">👑 Цель: королевский замок</div><div id="toast"></div><div id="joy"><div id="knob"></div></div><div id="buttons"><button onclick="interact()">◉ Взаимодействие</button><button onclick="sword()">⚔️ Меч</button><button onclick="rock()">🪨 Бросок</button><button onclick="flight()">🌀 Полёт</button><button onclick="mine()">⛏️ Кирка</button><button onclick="bagPanel()">🎒 Мешок</button><button onclick="mapPanel()">🗺️ Мир</button><button onclick="pauseGame()">Ⅱ Пауза</button></div><div id="panel"><div class="card" id="card"></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1);function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:3600,h:2400},p={x:520,y:980,dir:0,speed:175,fly:false,hp:100,maxHp:100,gold:0,dirt:7,stone:8,cap:20,bag:'Начальный (маленький)',xp:0,level:0},bags={'Начальный (маленький)':20,'Средний':30,'Большой':50,'Очень большой':80,'Гигантский':150};const villagers=[{id:1,name:'Илья',role:'Фермер',x:390,y:1180},{id:2,name:'Борис',role:'Лесоруб',x:520,y:1180},{id:3,name:'Марк',role:'Торговец',x:650,y:1180},{id:4,name:'Роман',role:'Кузнец',x:390,y:1325},{id:5,name:'Лев',role:'Алхимик',x:520,y:1325},{id:6,name:'Степан',role:'Шахтёр',x:650,y:1325},{id:7,name:'Данил',role:'Целитель',x:390,y:1470},{id:8,name:'Олег',role:'Охотник',x:520,y:1470},{id:9,name:'Фёдор',role:'Рыбак',x:650,y:1470},{id:10,name:'Пётр',role:'Пекарь',x:520,y:1615}],trust={};villagers.forEach(v=>trust[v.name]=0);const limits={boarPack:2,bigBoar:1,stoneMonster:1,wolfPack:3,alphaWolf:2,bear:2},mobNames={boarPack:'Стая кабанов',bigBoar:'Большой кабан',stoneMonster:'Каменный монстр',wolfPack:'Стая волков',alphaWolf:'Альфа-волк',bear:'Медведь'};let mobs=[],spawnClock=30,paused=false,quest=null,questStage=0,storyStage=0,redZones=[],ores=[{x:1180,y:750,type:'stone',h:3,max:3},{x:1290,y:820,type:'stone',h:4,max:4},{x:1430,y:740,type:'dirt',h:3,max:3}],last=performance.now();const wagon={x:1510,y:1400},mystery={x:1560,y:1400,name:'Таинственный человек'};
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1400)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function xpNeed(){return 100+p.level*25}function hud(){document.getElementById('hud').innerHTML='<b>Александр</b><br>❤️ '+Math.ceil(p.hp)+' / '+p.maxHp+'<br>Уровень: '+p.level+' • XP '+Math.floor(p.xp)+' / '+xpNeed()+'<br>🪙 '+p.gold+' золотых<br>🟫 '+p.dirt+' • 🪨 '+p.stone+' / '+p.cap+(quest?'<br>📜 '+quest.text:'')}hud();function open(t,b){document.getElementById('card').innerHTML='<h2>'+t+'</h2>'+b+'<p><button onclick="closePanel()">Закрыть</button></p>';document.getElementById('panel').classList.add('show')}function closePanel(){document.getElementById('panel').classList.remove('show')}function bagPanel(){open('🎒 Мешок','<p>Текущий: <b>'+p.bag+'</b> • вместимость '+p.cap+'</p><p>Средний — 30<br>Большой — 50<br>Очень большой — 80<br>Гигантский — 150</p>')}function mapPanel(){open('🗺️ Мир','<p>👑 Замок • 🏘️ Деревня • 🌲 Лес • ⛏️ Пещера • 🛒 Повозка</p><p>Красные области предупреждают об атаках врагов.</p>')}function pauseGame(){paused=!paused;toast(paused?'Ⅱ Пауза':'▶ Продолжить')}
function interact(){let v=villagers.find(v=>dist(p,v)<72);if(v){if(v.id===1)open('💬 Илья','<p><b>Фермер</b></p><p>«Александр, защити мой урожай!»</p><p>❤️ Доверие: '+trust.Илья+'/100</p>'+(quest?'':'<button onclick="acceptQuest()">📜 Взять квест</button>'));else open('💬 '+v.name,'<p><b>'+v.role+'</b></p><p>«Рад тебя видеть, Александр.»</p><p>❤️ Доверие: '+trust[v.name]+'/100</p>');return}if(dist(p,mystery)<100||dist(p,wagon)<105){mysteryTalk();return}toast('◉ Рядом нет объекта для взаимодействия')}
function acceptQuest(){closePanel();quest={text:'Защитить урожай Ильи',target:3};questStage=1;toast('📜 Квест принят! Мобы появились на поле');for(let i=0;i<3;i++)spawnMob('boarPack',430+i*55,1030);hud()}function completeQuest(){if(!quest)return;quest=null;questStage=0;p.gold+=250;trust.Илья=clamp(trust.Илья+10,0,100);villagers.filter(v=>v.id!==1).forEach(v=>trust[v.name]=clamp(trust[v.name]+1,0,100));p.xp+=80;toast('🪙 +250 золотых • ❤️ Доверие Ильи +10');hud()}
function mysteryTalk(){if(storyStage===0){storyStage=1;open('🛒 Повозка — незнакомец','<p><b>Александр:</b> «Эй. Ты кто?»</p><p><b>Таинственный человек:</b> «Человек, который слишком долго идёт по одной дороге.»</p><p><b>Александр:</b> «А эта повозка твоя?»</p><p><b>Таинственный человек:</b> «Когда-то была.»</p><p><b>Александр:</b> «Что ты здесь делаешь?»</p><p><b>Таинственный человек:</b> «Жду.»</p><p><b>Александр:</b> «Кого?»</p><p><b>Таинственный человек:</b> «Пока не знаю.»</p><p><b>Александр:</b> «Мы ещё встретимся?»</p><p><b>Таинственный человек:</b> «Если ты продолжишь идти — обязательно.»</p>')}else open('🧙 Таинственный человек','<p>Он молча смотрит на редкие травы.</p><p>«Не всё, что растёт из земли, является травой.»</p>')}
function mobHP(t){return t==='stoneMonster'?360:t==='bigBoar'?260:t==='alphaWolf'?220:t==='bear'?240:t==='boarPack'?210:150}function spawnMob(type,x,y){if(mobs.filter(m=>m.type===type).length>=limits[type])return false;let hp=mobHP(type),m={type,x,y,hp,max:hp,cd:Math.random(),members:null};if(type==='wolfPack'||type==='boarPack'){m.members=[];let n=type==='wolfPack'?4:3;for(let i=0;i<n;i++)m.members.push({x:x+Math.random()*80-40,y:y+Math.random()*80-40,hp:type==='wolfPack'?55:70,cd:Math.random(),a:Math.random()*6.28})}mobs.push(m);return true}function findSpawn(t){for(let i=0;i<30;i++){let x=220+Math.random()*(world.w-440),y=220+Math.random()*(world.h-440);if(t==='stoneMonster'&&!(x>1050&&x<1700&&y>500&&y<1050))continue;if(dist({x,y},p)<420||dist({x,y},wagon)<230)continue;return{x,y}}return null}function randomSpawn(){let a=Object.keys(limits).filter(t=>mobs.filter(m=>m.type===t).length<limits[t]);if(!a.length)return;let t=a[Math.floor(Math.random()*a.length)],s=findSpawn(t);if(s)spawnMob(t,s.x,s.y)}
function damagePlayer(n){p.hp-=n;if(p.hp<=0){p.hp=p.maxHp;p.x=520;p.y=980;toast('💫 Александр вернулся в деревню')}hud()}function warn(x,y,r,dmg){redZones.push({x,y,r,t:.7,dmg})}function ai(m,dt){let dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;m.cd-=dt;if(m.type==='stoneMonster'){if(d<650&&m.cd<=0){warn(p.x,p.y,55,24);m.cd=3.2}else if(d>180){m.x+=dx/d*25*dt;m.y+=dy/d*25*dt}}else if(m.type==='bear'){if(d>100){m.x+=dx/d*38*dt;m.y+=dy/d*38*dt}else if(m.cd<=0){warn(m.x+dx/d*30,m.y+dy/d*30,72,32);m.cd=2.1}}else if(m.type==='bigBoar'){if(d>120&&m.cd<=0){let a=Math.atan2(dy,dx);warn(m.x+Math.cos(a)*210,m.y+Math.sin(a)*210,50,38);m.cd=3}else if(d<=120&&m.cd<=0){warn(p.x,p.y,55,30);m.cd=1.5}}else if(m.type==='alphaWolf'){if(d<430&&m.cd<=0){warn(p.x,p.y,50,25);m.cd=2.8}m.x+=dx/d*(d>180?55:28)*dt;m.y+=dy/d*(d>180?55:28)*dt}else if(m.type==='wolfPack'||m.type==='boarPack'){for(const a of m.members){let ax=p.x-a.x,ay=p.y-a.y,ad=Math.hypot(ax,ay)||1;a.cd-=dt;if(ad>115){a.x+=ax/ad*(m.type==='boarPack'?82:68)*dt;a.y+=ay/ad*(m.type==='boarPack'?82:68)*dt}else if(a.cd<=0){warn(a.x+ax/ad*35,a.y+ay/ad*35,m.type==='boarPack'?52:42,m.type==='boarPack'?20:16);a.cd=1} }m.x=m.members.reduce((s,a)=>s+a.x,0)/m.members.length;m.y=m.members.reduce((s,a)=>s+a.y,0)/m.members.length}}
function resolve(dt){for(let i=redZones.length-1;i>=0;i--){let z=redZones[i];z.t-=dt;if(z.t<=0){if(dist(p,z)<z.r)damagePlayer(z.dmg);redZones.splice(i,1)}}}function sword(){let n=0;for(const m of [...mobs])if(dist(p,m)<105){m.hp-=55;n++;if(m.hp<=0)kill(m)}toast(n?'⚔️ Попадание!':'⚔️ Промах');hud()}function rock(){if(p.stone<1){toast('🪨 Нет камня');return}p.stone--;let b=mobs.filter(m=>dist(p,m)<480).sort((a,b)=>dist(p,a)-dist(p,b))[0];if(b){b.hp-=40;toast('🪨 Магический бросок попал');if(b.hp<=0)kill(b)}else toast('🪨 Камень улетел вдаль');hud()}function kill(m){let i=mobs.indexOf(m);if(i>=0)mobs.splice(i,1);p.xp+=m.type==='stoneMonster'?100:35;if(quest&&questStage===1){quest.target--;if(quest.target<=0)completeQuest()}if(p.xp>=xpNeed()){p.xp-=xpNeed();p.level++;toast('⬆️ Уровень '+p.level)}hud()}function mine(){let o=ores.find(o=>dist(p,o)<85);if(!o){toast('⛏️ Подойди к руде');return}o.h--;if(o.h<=0){if(o.type==='stone')p.stone+=2;else p.dirt+=2;o.h=o.max;toast('⛏️ Ресурс добыт')}else toast('⛏️ Удар киркой');hud()}function flight(){p.fly=!p.fly;toast(p.fly?'🌀 Полёт включён':'🌀 Полёт выключен')}function draw(camX,camY){ctx.fillStyle='#315f34';ctx.fillRect(0,0,W,H);for(let x=-camX%64;x<W;x+=64)for(let y=-camY%64;y<H;y+=64){ctx.fillStyle=((x+y)/64%2?'#356838':'#386e3b');ctx.fillRect(x,y,64,64)}function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x-camX,y-camY,w,h)}function C(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x-camX,y-camY,r,0,6.283);ctx.fill()}R(250,1050,520,700,'#80663d');R(300,1100,420,600,'#6f9348');R(170,580,500,360,'#547b3e');R(1000,430,720,650,'#514d49');R(1150,520,430,430,'#292a29');R(300,520,180,120,'#b8b0a0');R(355,475,70,45,'#743d2e');R(430,675,260,100,'#8c8c80');R(1350,1280,320,240,'#72553c');R(wagon.x-70,wagon.y-30,140,60,'#7a4b2a');C(wagon.x-50,wagon.y+45,18,'#242424');C(wagon.x+50,wagon.y+45,18,'#242424');for(const v of villagers){C(v.x,v.y,18,'#d8b08a');R(v.x-14,v.y+15,28,34,'#4b78a9');ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText(v.name,v.x-camX-18,v.y-camY-28)}C(mystery.x,mystery.y,18,'#b9b0a0');R(mystery.x-15,mystery.y+14,30,38,'#3c4a56');ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText('Таинственный',mystery.x-camX-39,mystery.y-camY-28);for(const o of ores)C(o.x,o.y,22,o.type==='stone'?'#737373':'#76502f');for(const m of mobs){let col=m.type==='stoneMonster'?'#696969':m.type==='bear'?'#63472e':m.type==='bigBoar'?'#6b3f25':m.type==='alphaWolf'?'#9b9b9b':m.type==='wolfPack'?'#777':'#81522d';C(m.x,m.y,25,col);if(m.members)for(const a of m.members)C(a.x,a.y,13,col);ctx.fillStyle='#000';ctx.fillRect(m.x-camX-25,m.y-camY-39,50,5);ctx.fillStyle='#8fdf75';ctx.fillRect(m.x-camX-25,m.y-camY-39,50*Math.max(0,m.hp/m.max),5)}for(const z of redZones){ctx.fillStyle='rgba(255,45,45,.28)';ctx.beginPath();ctx.arc(z.x-camX,z.y-camY,z.r,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,80,80,.75)';ctx.stroke()}C(p.x,p.y,p.fly?17:15,'#e6d19b');R(p.x-9,p.y+12,18,28,'#273e8c');if(p.fly){ctx.strokeStyle='rgba(180,240,255,.75)';ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,28,0,6.283);ctx.stroke()}}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(!paused){spawnClock-=dt;if(spawnClock<=0){spawnClock=30;if(Math.random()<.4)randomSpawn()}let mx=joy.x,my=joy.y;if(keys.ArrowLeft)mx=-1;if(keys.ArrowRight)mx=1;if(keys.ArrowUp)my=-1;if(keys.ArrowDown)my=1;let l=Math.hypot(mx,my)||1;if(Math.abs(mx)+Math.abs(my)){p.x+=mx/l*p.speed*dt;p.y+=my/l*p.speed*dt;p.dir=Math.atan2(my,mx)}p.x=clamp(p.x,30,world.w-30);p.y=clamp(p.y,30,world.h-30);for(const m of mobs)ai(m,dt);resolve(dt)}let cx=clamp(p.x-W/2,0,world.w-W),cy=clamp(p.y-H/2,0,world.h-H);draw(cx,cy);requestAnimationFrame(loop)}let keys={},joy={x:0,y:0};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');function sj(e){let r=joyEl.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),mx=42;if(d>mx){x=x/d*mx;y=y/d*mx}joy.x=x/mx;joy.y=y/mx;knob.style.left=34+x+'px';knob.style.top=34+y+'px'}function rj(){joy.x=joy.y=0;knob.style.left='34px';knob.style.top='34px'}joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);sj(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)sj(e)});joyEl.addEventListener('pointerup',rj);joyEl.addEventListener('pointercancel',rj);requestAnimationFrame(loop);
