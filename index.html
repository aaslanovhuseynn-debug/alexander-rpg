<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Александр RPG — Beta 15</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:20;left:10px;top:max(8px,env(safe-area-inset-top));padding:9px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-size:12px;line-height:1.45;text-shadow:1px 1px #000;pointer-events:none}
#title{position:fixed;z-index:20;right:10px;top:max(8px,env(safe-area-inset-top));padding:8px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-weight:900;font-size:12px;pointer-events:none}
#quest{position:fixed;z-index:20;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 12px;background:#07100ddd;border:1px solid #d4c47b99;border-radius:12px;font-size:12px;font-weight:900;pointer-events:none;white-space:nowrap}
#buttons{position:fixed;z-index:30;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(250px,43vw)}
button{border:1px solid #c8d3c2;background:#172219ed;color:#fff;border-radius:14px;padding:11px 8px;font-weight:900;font-size:12px;box-shadow:0 6px 16px #0009}
button:active{transform:scale(.95);background:#41553f}
#joy{position:fixed;z-index:30;left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid #c7d4c055;background:#07100b88}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;left:35px;top:35px;background:#dfe8dcaa;border:1px solid #fff8}
#arrow{position:fixed;z-index:25;display:none;font-size:42px;text-shadow:0 0 12px #58aaff,0 3px 8px #000;pointer-events:none}
#toast{position:fixed;z-index:60;left:50%;top:29%;transform:translate(-50%,-12px);padding:8px 12px;background:#050805ef;border:1px solid #d2dec9aa;border-radius:10px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:#020403e8;padding:18px}
#panel.show{display:flex}.card{width:min(580px,94vw);max-height:86vh;overflow:auto;background:#1b241d;border:1px solid #bac8b4;border-radius:18px;padding:18px;box-shadow:0 20px 70px #000}
.card h2{margin:0 0 10px}.card p,.card li{line-height:1.45}.card button{margin:4px}

/* Beta 11 combat feedback */
#combatFlash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,80,40,0) 55%);transition:opacity .08s}
#combatLabel{position:fixed;z-index:56;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:1000;text-shadow:0 3px 10px #000;opacity:0;pointer-events:none;transition:.16s}
#combatLabel.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Beta 14 — Living World NPCs */
.npcTag{font-weight:900;text-shadow:0 2px 5px #000}
.traitorHint{color:#ff7777;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div><div id="title">ALEXANDER RPG • BETA 15</div>
<div id="quest">👑 Цель: королевский замок</div><div id="arrow">➤</div><div id="toast"></div><div id="combatFlash"></div><div id="combatLabel"></div>
<div id="joy"><div id="knob"></div></div>
<div id="buttons">
<button onclick="interact()">◉ Взаимодействие</button>
<button onclick="sword()">⚔️ Меч</button>
<button onclick="rock()">🪨 Бросок</button>
<button onclick="flight()">🌀 Полёт</button>
<button onclick="mineResource()">⛏️ Кирка</button>
<button onclick="bag()">🎒 Мешок</button>
<button onclick="mapPanel()">🗺️ Мир</button>
<button onclick="pauseGame()">Ⅱ Пауза</button>
</div>
<div id="panel"><div class="card" id="card"></div></div>


<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const world={w:3600,h:2400};
const p={x:520,y:1020,dir:0,level:0,xp:0,hp:100,maxHp:100,gold:0,dirt:7,stone:8,cap:20,bag:'Начальный (маленький)',fly:false};
const bags={'Начальный (маленький)':20,'Средний':30,'Большой':50,'Очень большой':80,'Гигантский':150};
const bagPrices={Средний:500,Большой:1000,'Очень большой':1800,Гигантский:3000};
const target={x:430,y:690};
const keys={},joy={x:0,y:0}; let paused=false,time=0,last=performance.now(),pickA=0;
let notes=[],ores=[],particles=[],mobs=[],telegraphs=[],attackFx=null;
let quest={accepted:false,done:false,kills:0,need:3};
const villagers=[
 {id:1,name:'Илья',role:'Фермер',color:'#2f6fb0',x:420,y:1180,trust:0},
 {id:2,name:'Борис',role:'Лесоруб',color:'#3f8f52',x:570,y:1180,trust:0},
 {id:3,name:'Марк',role:'Торговец',color:'#d6b52e',x:720,y:1180,trust:0},
 {id:4,name:'Роман',role:'Кузнец',color:'#a83b3b',x:870,y:1180,trust:0},
 {id:5,name:'Лев',role:'Алхимик',color:'#7445a8',x:420,y:1340,trust:0},
 {id:6,name:'Степан',role:'Шахтёр',color:'#76513a',x:570,y:1340,trust:0},
 {id:7,name:'Данил',role:'Целитель',color:'#e8e8e8',x:720,y:1340,trust:0},
 {id:8,name:'Олег',role:'Охотник',color:'#d47b24',x:870,y:1340,trust:0},
 {id:9,name:'Фёдор',role:'Рыбак',color:'#4aa8c7',x:500,y:1490,trust:0},
 {id:10,name:'Пётр',role:'Пекарь',color:'#d889a9',x:780,y:1490,trust:0}
];
const wagon={x:1510,y:1415};
const mysterious={x:1600,y:1325,met:false};
const combatZone={x:1850,y:980,r:180};

function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}
function nextXP(){return 100+p.level*10}
function hud(){
 document.getElementById('hud').innerHTML='<b>Александр</b><br>❤️ '+Math.max(0,Math.floor(p.hp))+' / '+p.maxHp+
 '<br>Уровень: '+p.level+' • XP '+Math.floor(p.xp)+' / '+nextXP()+
 '<br>🪙 '+p.gold+' золотых<br>🟫 '+p.dirt.toFixed(1)+' • 🪨 '+p.stone.toFixed(1)+' / '+p.cap+
 '<br>🎒 '+p.bag;
}
function note(x,y,t){notes.push({x,y,t,l:1})}
function addRes(type,n){let room=Math.max(0,p.cap-p.dirt-p.stone),g=Math.min(n,room);if(!g){toast('🎒 Мешок заполнен');return}p[type]+=g;note(p.x,p.y-45,'+'+g+(type==='stone'?'🪨':'🟫'));hud()}
function spend(a,b){if(p.dirt<a||p.stone<b){toast('⚠️ Недостаточно ресурсов');return false}p.dirt-=a;p.stone-=b;hud();return true}
function open(title,body){document.getElementById('card').innerHTML='<h2>'+title+'</h2>'+body+'<p><button onclick="closePanel()">Закрыть</button></p>';document.getElementById('panel').classList.add('show')}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function bag(){
 let s='<p>Надет: <b>'+p.bag+'</b> • вместимость '+p.cap+'.</p><p>Покупка только за 🪙 золото:</p>';
 for(const [name,cap] of Object.entries(bags)) if(name!=='Начальный (маленький)') s+='<button onclick="buyBag(\''+name+'\')">'+name+' — '+cap+' мест • '+bagPrices[name]+' 🪙</button> ';
 open('🎒 Мешок',s)
}
function buyBag(name){let cost=bagPrices[name];if(p.gold<cost){toast('❌ Не хватает золота');return}p.gold-=cost;p.cap=bags[name];p.bag=name;hud();toast('🎒 Куплен '+name);closePanel()}
function mapPanel(){open('🗺️ Королевство','<p>🏘️ Деревня • 🛒 Повозка • 🧙 Таинственный человек • 🪨 Пещера • ⚔️ места сражений • 👑 королевский замок.</p><p>Главная цель: добраться до замка.</p>')}
function pauseGame(){paused=!paused;toast(paused?'Ⅱ Пауза':'▶ Продолжить')}
function flight(){if(p.fly){p.fly=false;toast('🌀 Полёт выключен');return}if(p.dirt<.5||p.stone<.5){toast('⚠️ Нужно 0.5🟫 и 0.5🪨');return}p.fly=true;toast('🌀 Полёт включён')}
function sword(){attackFx={type:'sword',t:0,d:.38};let hit=false;for(const m of mobs){if(Math.hypot(m.x-p.x,m.y-p.y)<125 && Math.abs(angleDiff(p.dir,Math.atan2(m.y-p.y,m.x-p.x)))<1.25){damageMob(m,22);hit=true}}toast(hit?'⚔️ Попадание!':'⚔️ Замах')}
function rock(){if(!spend(1,1))return;attackFx={type:'rock',t:0,d:.65};let best=null,bd=520;for(const m of mobs){let d=Math.hypot(m.x-p.x,m.y-p.y);if(d<bd&&Math.abs(angleDiff(p.dir,Math.atan2(m.y-p.y,m.x-p.x)))<.45){best=m;bd=d}}if(best)setTimeout(()=>{if(mobs.includes(best))damageMob(best,18)},280);toast('🪨 Магический бросок')}
function angleDiff(a,b){let d=(a-b+Math.PI)%(Math.PI*2)-Math.PI;return Math.abs(d)}
function mineResource(){let o=ores.find(o=>Math.hypot(p.x-o.x,p.y-o.y)<85);if(!o){toast('⛏️ Подойди к руде');return}pickA=.75;o.h--;note(o.x,o.y-45,'⛏️');if(o.h<=0){addRes(o.type,Math.random()<.65?1:Math.random()<.9?2:3);o.h=o.max}}
function interact(){
 let v=villagers.reduce((a,b)=>Math.hypot(p.x-b.x,p.y-b.y)<Math.hypot(p.x-a.x,p.y-a.y)?b:a,villagers[0]);
 if(Math.hypot(p.x-v.x,p.y-v.y)<100){
   let body='<p><b>'+v.role+'</b></p><p>Доверие: ❤️ '+v.trust+' / 100</p>';
   if(v.id===1 && !quest.accepted && !quest.done) body+='<p>«Александр, защити мой урожай! Волки и кабаны снова приходят на поле.»</p><button onclick="acceptQuest()">Принять задание</button>';
   else if(v.id===1 && quest.accepted && !quest.done) body+='<p>«Избавься от трёх опасных зверей у поля.»</p><p>Прогресс: '+quest.kills+' / '+quest.need+'</p>';
   else if(v.id===1 && quest.done) body+='<p>«Спасибо, Александр! Ты спас мой урожай.»</p>';
   else body+='<p>«Рад тебя видеть, Александр.»</p>';
   open('💬 '+v.name,body);return;
 }
 if(Math.hypot(p.x-wagon.x,p.y-wagon.y)<140 || Math.hypot(p.x-mysterious.x,p.y-mysterious.y)<120){mysterious.met=true;open('🧙 Таинственный человек',
 '<p>«Человек, который слишком долго идёт по одной дороге.»</p>'+
 '<p>«Здесь кое-что растёт.»</p><p>«Не всё, что растёт из земли, является травой.»</p>'+
 '<p>«Если ты продолжишь идти — обязательно.»</p>');return}
 if(Math.hypot(p.x-target.x,p.y-target.y)<180){open('👑 Королевский замок','<p>Высокая крепость с мраморным залом, красным ковром и королевским креслом.</p>');return}
 let o=ores.find(o=>Math.hypot(p.x-o.x,p.y-o.y)<90);if(o){mineResource();return}
 toast('◉ Здесь пока нечего взаимодействовать')
}
function acceptQuest(){quest.accepted=true;closePanel();toast('📜 Квест принят: защити урожай');for(let i=0;i<2;i++)spawnPack('wolf',1820+i*70,1040+i*30);for(let i=0;i<1;i++)spawnPack('boar',1740,1110+i*60)}
function damageMob(m,d){m.hp-=d;note(m.x,m.y-35,'-'+d);if(m.hp<=0){mobs=mobs.filter(x=>x!==m);p.xp+=m.xp;p.gold+=m.gold;note(m.x,m.y,'🪙 +'+m.gold);if(quest.accepted&&!quest.done&&['wolf','boar'].includes(m.type)){quest.kills++;if(quest.kills>=quest.need)finishQuest()}hud()}}
function finishQuest(){quest.done=true;const ilya=villagers[0];ilya.trust=Math.min(100,ilya.trust+18);for(const v of villagers.slice(1))v.trust=Math.min(100,v.trust+1);p.gold+=350;p.xp+=100;toast('🏆 Квест выполнен! +350 🪙 • доверие Ильи +18');hud()}
function damagePlayer(d){p.hp-=d;note(p.x,p.y-50,'-'+d+' ❤️');if(p.hp<=0){p.hp=p.maxHp;p.x=520;p.y=1020;toast('💫 Александр потерял сознание и вернулся в деревню')}hud()}
function spawnPack(type,x,y){
 const stats={wolf:{hp:55,max:55,spd:105,dmg:10,xp:18,gold:20,r:.65},boar:{hp:70,max:70,spd:145,dmg:13,xp:22,gold:25,r:.75},bear:{hp:130,max:130,spd:62,dmg:20,xp:35,gold:45,r:.9},bigboar:{hp:210,max:210,spd:125,dmg:28,xp:60,gold:90,r:1.0},stone:{hp:260,max:260,spd:42,dmg:30,xp:80,gold:120,r:1.15}}[type];
 if(!stats)return;let m={type,x,y,...stats,cd:Math.random(),tele:0,state:'idle',targetX:x,targetY:y,phase:0,retreat:0,side:Math.random()<.5?-1:1};mobs.push(m)
}
function spawnRandom(){
 const counts=t=>mobs.filter(m=>m.type===t).length;
 const candidates=[];
 if(counts('boar')<2)candidates.push('boar');
 if(counts('bigboar')<1)candidates.push('bigboar');
 if(counts('stone')<1)candidates.push('stone');
 if(counts('wolf')<12)candidates.push('wolf'); // individual cap supports up to 3 packs
 if(counts('bear')<2)candidates.push('bear');
 if(!candidates.length)return;
 let type=candidates[Math.floor(Math.random()*candidates.length)],spot;
 if(type==='stone')spot=[850+Math.random()*350,320+Math.random()*180];
 else if(type==='bear'||type==='wolf')spot=[1250+Math.random()*850,650+Math.random()*1000];
 else spot=[1500+Math.random()*1000,1100+Math.random()*600];
 spawnPack(type,spot[0],spot[1]);toast('⚠️ Вдалеке появился '+mobName(type))
}
function mobName(t){return {wolf:'волк',boar:'кабан',bigboar:'большой кабан',bear:'медведь',stone:'каменный монстр'}[t]}
function nearestPlayerDist(m){return Math.hypot(m.x-p.x,m.y-p.y)}
function telegraph(m,kind,tx,ty,r=.55){
 if(m.tele>0)return;m.tele=r;m.targetX=tx;m.targetY=ty;m.phase=0;
 telegraphs.push({m,kind,ttl:r,tx,ty})
}
function mobAI(m,dt){
 const d=nearestPlayerDist(m), ang=Math.atan2(p.y-m.y,p.x-m.x);
 m.cd-=dt;
 if(m.tele>0){m.tele-=dt;m.phase=Math.min(1,1-m.tele/.55);return}
 if(d>520){return}
 if(m.type==='wolf'){
   if(d>75){m.x+=Math.cos(ang)*m.spd*dt;m.y+=Math.sin(ang)*m.spd*dt}
   else if(m.cd<=0){if(Math.random()<.35){m.x+=Math.cos(ang+m.side*1.2)*90;m.y+=Math.sin(ang+m.side*1.2)*90}else telegraph(m,'cone',p.x,p.y,.7);m.cd=1}
 }else if(m.type==='boar'){
   if(d>130){m.x+=Math.cos(ang)*m.spd*dt;m.y+=Math.sin(ang)*m.spd*dt}
   else if(m.cd<=0){let tx=p.x+Math.cos(ang)*230,ty=p.y+Math.sin(ang)*230;telegraph(m,'line',tx,ty,.75);m.state='charge';m.cd=1.8}
   if(m.state==='charge'&&m.tele<=0){m.x+=Math.cos(ang)*190*dt;m.y+=Math.sin(ang)*190*dt;m.state='idle'}
 }else if(m.type==='bear'){
   if(d>95){m.x+=Math.cos(ang)*m.spd*dt;m.y+=Math.sin(ang)*m.spd*dt}
   else if(m.cd<=0){let r=Math.random();if(r<.34)telegraph(m,'arc',p.x,p.y,.8);else if(r<.67)telegraph(m,'circle',m.x,m.y,.9);else telegraph(m,'line',p.x,p.y,.7);m.cd=1.9}
 }else if(m.type==='bigboar'){
   if(d>120){m.x+=Math.cos(ang)*m.spd*dt;m.y+=Math.sin(ang)*m.spd*dt}
   else if(m.cd<=0){telegraph(m,'line',p.x+Math.cos(ang)*300,p.y+Math.sin(ang)*300,1);m.state='charge';m.cd=2.2}
   if(m.state==='charge'&&m.tele<=0){let back=Math.atan2(p.y-m.y,p.x-m.x);m.x+=Math.cos(back)*m.spd*dt;m.y+=Math.sin(back)*m.spd*dt;m.state='idle'}
 }else if(m.type==='stone'){
   if(d>170){m.x+=Math.cos(ang)*m.spd*dt;m.y+=Math.sin(ang)*m.spd*dt}
   if(d<420&&m.cd<=0){telegraph(m,'stone',p.x,p.y,.9);m.cd=2.3}
 }
}
function resolveTelegraphs(){
 for(let i=telegraphs.length-1;i>=0;i--){let t=telegraphs[i];if(!mobs.includes(t.m)){telegraphs.splice(i,1);continue}t.ttl-=1/60;if(t.ttl<=0){let m=t.m;let hit=false;
   if(t.kind==='line'||t.kind==='stone'){let vx=t.tx-m.x,vy=t.ty-m.y,len=Math.hypot(vx,vy)||1,px=p.x-m.x,py=p.y-m.y,proj=(px*vx+py*vy)/len;let perp=Math.abs(px*vy-py*vx)/len;hit=proj>-20&&proj<len+30&&perp<45}
   else if(t.kind==='circle')hit=Math.hypot(p.x-m.x,p.y-m.y)<115;
   else hit=Math.hypot(p.x-m.x,p.y-m.y)<105;
   if(hit)damagePlayer(m.dmg);telegraphs.splice(i,1);
 }}
}
function setup(){
 ores=[[760,300,'stone'],[930,350,'stone'],[1060,265,'dirt'],[720,455,'dirt'],[1010,460,'stone'],[1130,360,'stone'],[870,405,'stone'],[980,520,'dirt']].map(a=>({x:a[0],y:a[1],type:a[2],h:4,max:4}));
}
setup();

function move(dt){
 let x=(keys.d?1:0)-(keys.a?1:0)+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),y=(keys.s?1:0)-(keys.w?1:0)+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
 x+=joy.x;y+=joy.y;let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 let sp=p.fly?270:175;p.x=Math.max(30,Math.min(world.w-30,p.x+x*sp*dt));p.y=Math.max(30,Math.min(world.h-30,p.y+y*sp*dt));if(l>.1)p.dir=Math.atan2(y,x);
 if(p.fly){move.t=(move.t||0)+dt;if(move.t>=1){move.t=0;if(!spend(.5,.5)){p.fly=false;toast('⚠️ Ресурсы закончились')}}}
}
function cam(){return{x:Math.max(0,Math.min(world.w-W,p.x-W/2)),y:Math.max(0,Math.min(world.h-H,p.y-H/2))}}
function rect(x,y,w,h,f,s){ctx.fillStyle=f;ctx.fillRect(x,y,w,h);if(s){ctx.strokeStyle=s;ctx.strokeRect(x,y,w,h)}}
function poly(a,f,s){ctx.beginPath();a.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.stroke()}}
function circ(x,y,r,f,s){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.stroke()}}
function label(x,y,t,size=13){ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}
function tree(x,y,s){ctx.fillStyle='#4d3927';ctx.fillRect(x-6,y,s*.32,s*1.6);circ(x,y,s,'#1f4b29','#17351f');circ(x-18,y+12,s*.62,'#2d6537');circ(x+20,y+13,s*.58,'#2d6537')}
function house(x,y){rect(x,y,105,75,'#c9b99c','#604c34');poly([[x-12,y],[x+52,y-55],[x+118,y]],'#7d3e32');rect(x+40,y+38,25,37,'#5a4630');circ(x+22,y+25,9,'#8dc8d5');circ(x+82,y+25,9,'#8dc8d5')}
function castle(){rect(80,545,700,430,'#717873','#303530');rect(145,610,570,300,'#d9d4c8','#625c51');rect(70,510,105,475,'#656b66');rect(685,510,105,475,'#656b66');poly([[210,615],[430,385],[650,615]],'#c9a72d','#765f19');rect(340,755,180,150,'#513a2c');rect(235,675,390,80,'#802630');label(430,725,'КОРОЛЕВСКИЙ ЗАЛ',12);rect(385,645,90,85,'#992633','#d2ae46');label(430,698,'♛',28);for(let x of [280,580]){circ(x,735,18,'#b9c3bf');rect(x-10,753,20,85,'#59645d')}label(430,1015,'КОРОЛЕВСКИЙ ЗАМОК',20)}
function renderMine(){rect(610,135,600,410,'#5b5146','#292621');rect(665,210,490,290,'#20251f');poly([[665,320],[770,205],[850,320],[935,170],[1035,315],[1125,220],[1155,500],[665,500]],'#343c36');label(910,575,'ШАХТА',19);label(910,598,'каменные и грязевые жилы',11)}
function tower(){rect(2170,100,400,740,'#81776d','#34352f');for(let y=200;y<780;y+=105)rect(2245,y,250,82,'#645a50','#3b342e');poly([[2110,150],[2370,0],[2630,150]],'#54462f','#2e261d');rect(2318,710,105,130,'#4a3528');label(2370,880,'БАШНЯ МАГА',19)}
function wagonDraw(){rect(wagon.x-95,wagon.y-45,185,95,'#70472f','#c9a45d');circ(wagon.x-60,wagon.y+67,28,'#252525');circ(wagon.x+50,wagon.y+67,28,'#252525');poly([[wagon.x-65,wagon.y-45],[wagon.x,wagon.y-110],[wagon.x+65,wagon.y-45]],'#6b4630');label(wagon.x,wagon.y+110,'ПОВОЗКА',13)}
function ore(o){let col=o.type==='stone'?'#aab2ae':'#855b3c';poly([[o.x-35,o.y+22],[o.x-22,o.y-28],[o.x+12,o.y-42],[o.x+40,o.y-5],[o.x+28,o.y+32]],col,'#313732');label(o.x,o.y+55,'⛏️ '+o.h,11)}
function drawVillagers(){
 for(const v of villagers){let bob=Math.sin(performance.now()/700+v.id)*3;
  ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(v.x,v.y+28,18,7,0,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=v.color;ctx.fillRect(v.x-13,v.y+2+bob,26,32);ctx.fillStyle='#b97850';ctx.beginPath();ctx.arc(v.x,v.y-10+bob,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#68402b';ctx.beginPath();ctx.arc(v.x,v.y-17+bob,13,Math.PI,Math.PI*2);ctx.fill();
  label(v.x,v.y-30+bob,v.name,12);ctx.font='10px sans-serif';ctx.fillStyle='#ddd';ctx.fillText(v.role,v.x,v.y+48+bob)
 }}
function drawMob(m){
 const hp=Math.max(0,m.hp/m.max);
 if(m.type==='wolf'){circ(m.x,m.y,24,'#777f87','#30353a');circ(m.x-9,m.y-13,7,'#596068');circ(m.x+9,m.y-13,7,'#596068');poly([[m.x-18,m.y-20],[m.x-8,m.y-38],[m.x,m.y-22]],'#596068');poly([[m.x+18,m.y-20],[m.x+8,m.y-38],[m.x,m.y-22]],'#596068')}
 if(m.type==='boar'){circ(m.x,m.y,29,'#76533e','#382a22');circ(m.x-10,m.y-11,8,'#8c634b');circ(m.x+10,m.y-11,8,'#8c634b');circ(m.x+22,m.y+3,8,'#a87958');}
 if(m.type==='bear'){circ(m.x,m.y,39,'#6a4a34','#35271f');circ(m.x-25,m.y-28,13,'#6a4a34');circ(m.x+25,m.y-28,13,'#6a4a34');circ(m.x,m.y-2,22,'#815a40')}
 if(m.type==='bigboar'){circ(m.x,m.y,42,'#603e30','#2d211b');circ(m.x-16,m.y-15,11,'#76503c');circ(m.x+16,m.y-15,11,'#76503c');circ(m.x+31,m.y+5,11,'#a16e52')}
 if(m.type==='stone'){circ(m.x,m.y,48,'#69706d','#303633');poly([[m.x-35,m.y-20],[m.x-10,m.y-55],[m.x+10,m.y-35],[m.x+35,m.y-60],[m.x+45,m.y+25],[m.x+10,m.y+50],[m.x-35,m.y+35]],'#707875','#313633')}
 rect(m.x-34,m.y-62,68,7,'#171b18');rect(m.x-34,m.y-62,68*hp,7,'#d85b52');label(m.x,m.y+68,mobName(m.type),11)
}
function drawTelegraphs(){
 for(const t of telegraphs){let a=1-Math.max(0,t.ttl)/.9;ctx.save();ctx.globalAlpha=.28+Math.sin(performance.now()/70)*.05;ctx.fillStyle='#ff3434';ctx.strokeStyle='#ff6a6a';ctx.lineWidth=3;
  if(t.kind==='line'||t.kind==='stone'){let ang=Math.atan2(t.ty-t.m.y,t.tx-t.m.x),len=Math.min(360,Math.hypot(t.tx-t.m.x,t.ty-t.m.y)+40);ctx.translate(t.m.x,t.m.y);ctx.rotate(ang);ctx.fillRect(0,-34,len,68);ctx.strokeRect(0,-34,len,68)}
  else if(t.kind==='circle'){ctx.beginPath();ctx.arc(t.m.x,t.m.y,115,0,Math.PI*2);ctx.fill();ctx.stroke()}
  else {ctx.beginPath();ctx.arc(t.m.x,t.m.y,105,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.restore();
 }}
function draw(){
 ctx.clearRect(0,0,W,H);let C=cam();ctx.save();ctx.translate(-C.x,-C.y);
 rect(0,0,world.w,world.h,'#356a38');
 for(let i=0;i<145;i++){let x=(i*251)%world.w,y=(i*149)%world.h;circ(x,y,26+(i%4)*11,'#3d754055')}
 for(let i=0;i<9;i++){let x=180+i*410;poly([[x,430],[x+190,80+(i%3)*50],[x+380,430]],'#466247','#2c4931')}
 ctx.strokeStyle='#3d8bb3';ctx.lineWidth=110;ctx.beginPath();ctx.moveTo(1330,0);ctx.bezierCurveTo(1170,400,1510,650,1320,1080);ctx.bezierCurveTo(1110,1450,1460,1780,1260,2400);ctx.stroke();
 ctx.strokeStyle='#a88458';ctx.lineWidth=72;ctx.beginPath();ctx.moveTo(350,900);ctx.lineTo(780,790);ctx.lineTo(940,540);ctx.stroke();ctx.beginPath();ctx.moveTo(700,800);ctx.lineTo(1500,980);ctx.lineTo(2070,1110);ctx.stroke();
 for(let i=0;i<95;i++){let x=1380+(i*173)%2050,y=120+(i*313)%2050;if(x>2080&&y<880)continue;tree(x,y,35+(i%4)*7)}
 for(let i=0;i<12;i++){let x=180+(i%4)*150,y=1100+Math.floor(i/4)*145;house(x,y)}
 label(520,1070,'СРЕДНЕВЕКОВАЯ ДЕРЕВНЯ',18);castle();renderMine();tower();wagonDraw();
 circ(combatZone.x,combatZone.y,combatZone.r,'#1b332955','#9bb59c');label(combatZone.x,combatZone.y-145,'МЕСТО БИТВЫ',14);
 circ(mysterious.x,mysterious.y,115,'#18373b55','#83c0c8');label(mysterious.x,mysterious.y-125,'ПОВОЗКА • ТАИНСТВЕННЫЙ',14);
 ores.forEach(ore);drawVillagers();mobs.forEach(drawMob);drawTelegraphs();player();ctx.restore();
 notes.forEach(n=>{let C=cam();label(n.x-C.x,n.y-C.y,n.t,14)});
}
function player(){
 circ(p.x,p.y,21,'#b97850','#2a201b');circ(p.x,p.y-28,15,'#68402b');rect(p.x-18,p.y+10,36,35,'#3b6072');
 if(p.fly){circ(p.x,p.y,35,'#8dd0ed33','#bfeeff');circ(p.x,p.y,44,'#bfeeff22')}
 if(attackFx){let q=Math.min(1,attackFx.t/attackFx.d);if(attackFx.type==='sword'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir);ctx.strokeStyle='#f2f5f2';ctx.lineWidth=8;ctx.beginPath();ctx.arc(45,0,80,-1.1,1.1);ctx.stroke();ctx.restore()}else{let d=80+q*330;circ(p.x+Math.cos(p.dir)*d,p.y+Math.sin(p.dir)*d-20*Math.sin(q*Math.PI),10,'#aaa092','#f0eadc')}}
}
function update(dt){
 if(paused)return;time+=dt;move(dt);pickA=Math.max(0,pickA-dt);if(attackFx){attackFx.t+=dt;if(attackFx.t>attackFx.d)attackFx=null}
 for(const m of mobs){mobAI(m,dt);m.x=Math.max(20,Math.min(world.w-20,m.x));m.y=Math.max(20,Math.min(world.h-20,m.y))}
 resolveTelegraphs();
 notes.forEach(n=>{n.l-=dt;n.y-=18*dt});notes=notes.filter(n=>n.l>0);hud();
 let C=cam(),sx=target.x-C.x,sy=target.y-C.y,ang=Math.atan2(sy-H/2,sx-W/2),ar=document.getElementById('arrow');
 if(Math.hypot(sx-W/2,sy-H/2)<180)ar.style.display='none';else{ar.style.display='block';ar.style.left=(W/2+Math.cos(ang)*Math.min(W,H)*.37)+'px';ar.style.top=(H/2+Math.sin(ang)*Math.min(W,H)*.37)+'px';ar.style.transform='translate(-50%,-50%) rotate('+ang+'rad)'}
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
let tid=null;const j=document.getElementById('joy');
function setJoy(x,y){let r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=r.width*.31;if(l>m){dx=dx/l*m;dy=dy/l*m}document.getElementById('knob').style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/m;joy.y=dy/m}
j.addEventListener('touchstart',e=>{tid=e.changedTouches[0].identifier;let q=e.changedTouches[0];setJoy(q.clientX,q.clientY)},{passive:true});
j.addEventListener('touchmove',e=>{for(let q of e.changedTouches)if(q.identifier===tid)setJoy(q.clientX,q.clientY)},{passive:true});
j.addEventListener('touchend',()=>{tid=null;joy.x=joy.y=0;document.getElementById('knob').style.transform='translate(0,0)'},{passive:true});

// Prevent Safari/iOS page zoom from changing the apparent game scale.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
hud();
setInterval(()=>{if(!paused&&Math.random()<.40)spawnRandom()},30000);
</script>
