<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Александр RPG — Beta 15.5.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:20;left:10px;top:max(8px,env(safe-area-inset-top));padding:9px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-size:12px;line-height:1.45;text-shadow:1px 1px #000;pointer-events:none}
#title{position:fixed;z-index:20;right:10px;top:max(8px,env(safe-area-inset-top));padding:8px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-weight:900;font-size:12px;pointer-events:none}
#quest{position:fixed;z-index:20;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 12px;background:#07100ddd;border:1px solid #d4c47b99;border-radius:12px;font-size:12px;font-weight:900;pointer-events:none;white-space:nowrap}
#buttons{position:fixed;z-index:30;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(250px,43vw)}
button{border:1px solid #c8d3c2;background:#172219ed;color:#fff;border-radius:14px;padding:11px 8px;font-weight:900;font-size:12px;box-shadow:0 6px 16px #0009}
button:active{transform:scale(.95);background:#41553f}
#joy{position:fixed;z-index:30;left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid #c7d4c055;background:#07100b88}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;left:35px;top:35px;background:#dfe8dcaa;border:1px solid #fff8}
#arrow{position:fixed;z-index:25;display:none;font-size:42px;text-shadow:0 0 12px #58aaff,0 3px 8px #000;pointer-events:none}
#toast{position:fixed;z-index:60;left:50%;top:29%;transform:translate(-50%,-12px);padding:8px 12px;background:#050805ef;border:1px solid #d2dec9aa;border-radius:10px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:#020403e8;padding:18px}
#panel.show{display:flex}.card{width:min(580px,94vw);max-height:86vh;overflow:auto;background:#1b241d;border:1px solid #bac8b4;border-radius:18px;padding:18px;box-shadow:0 20px 70px #000}
.card h2{margin:0 0 10px}.card p,.card li{line-height:1.45}.card button{margin:4px}

/* Beta 11 combat feedback */
#combatFlash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,80,40,0) 55%);transition:opacity .08s}
#combatLabel{position:fixed;z-index:56;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:1000;text-shadow:0 3px 10px #000;opacity:0;pointer-events:none;transition:.16s}
#combatLabel.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Beta 15.5.5 — Living World NPCs */
.npcTag{font-weight:900;text-shadow:0 2px 5px #000}
.traitorHint{color:#ff7777;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div><div id="title">ALEXANDER RPG • BETA 15.5</div>
<div id="quest">👑 Цель: королевский замок</div><div id="arrow">➤</div><div id="toast"></div><div id="combatFlash"></div><div id="combatLabel"></div>
<div id="joy"><div id="knob"></div></div>
<div id="buttons">
<button onclick="interact()">◉ Взаимодействие</button>
<button onclick="sword()">⚔️ Меч</button>
<button onclick="rock()">🪨 Бросок</button>
<button onclick="flight()">🌀 Полёт</button>
<button onclick="mineResource()">⛏️ Кирка</button>
<button onclick="bag()">🎒 Мешок</button>
<button onclick="mapPanel()">🗺️ Мир</button>
<button onclick="pauseGame()">Ⅱ Пауза</button>
</div>
<div id="panel"><div class="card" id="card"></div></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const world={w:3600,h:2400};
const p={x:540,y:1010,dir:0,level:0,xp:0,dirt:7,stone:8,cap:20,bag:'Начальный (маленький)',fly:false};
const bags={'Начальный (маленький)':20,'Средний':30,'Большой':50,'Очень большой':80,'Гигантский':150};
const target={x:430,y:690};
const keys={},joy={x:0,y:0};let paused=false,attack=0,attackKind='',pickA=0,time=0,last=performance.now();
let notes=[],ores=[],traders=[],butterflies=[],particles=[];
let combat={type:'',t:0,duration:0,phase:0};
let villagers=[
 {id:1,name:'Илья',role:'Фермер',color:'#2f6fb0',x:3200,y:980},
 {id:2,name:'Борис',role:'Лесоруб',color:'#3f8f52',x:3370,y:1050},
 {id:3,name:'Марк',role:'Торговец',color:'#d6b52e',x:3510,y:930},
 {id:4,name:'Роман',role:'Кузнец',color:'#a83b3b',x:3650,y:1090},
 {id:5,name:'Лев',role:'Алхимик',color:'#7445a8',x:3790,y:960},
 {id:6,name:'Степан',role:'Шахтёр',color:'#76513a',x:3930,y:1080},
 {id:7,name:'Данил',role:'Целитель',color:'#e8e8e8',x:4070,y:940},
 {id:8,name:'Олег',role:'Охотник',color:'#d47b24',x:4210,y:1060},
 {id:9,name:'Фёдор',role:'Рыбак',color:'#4aa8c7',x:4350,y:950},
 {id:10,name:'Пётр',role:'Пекарь',color:'#d889a9',x:4490,y:1070}
];
let traitorCount=0, traitorIds=new Set();
function chooseTraitors(){
  // 0..3 traitors, with fewer traitors more common.
  let r=Math.random();
  traitorCount = r<0.45?0:r<0.78?1:r<0.95?2:3;
  let pool=[...villagers];
  while(traitorIds.size<traitorCount){
    let n=pool[Math.floor(Math.random()*pool.length)];
    traitorIds.add(n.id);
  }
}
chooseTraitors();
setTimeout(()=>toast('🏘️ Жители деревни появились'),900);


function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1250)}
function nextXP(){return 100+p.level*10}
function hud(){document.getElementById('hud').innerHTML='<b>Александр</b><br>Уровень: '+p.level+' • XP: '+Math.floor(p.xp)+' / '+nextXP()+'<br>'+p.dirt.toFixed(1)+'🟫, '+p.stone.toFixed(1)+'🪨 / '+p.cap+'<br>🎒 '+p.bag}
function note(x,y,t){notes.push({x,y,t,l:1})}
function addRes(type,n){let room=Math.max(0,p.cap-p.dirt-p.stone),g=Math.min(n,room);if(!g){toast('🎒 Мешок заполнен');return}p[type]+=g;note(p.x+Math.random()*80-40,p.y-45,'+'+g+(type==='stone'?'🪨':'🟫'));hud()}
function spend(a,b){if(p.dirt<a||p.stone<b){toast('⚠️ Недостаточно ресурсов');return false}p.dirt-=a;p.stone-=b;hud();return true}
function open(title,body){document.getElementById('card').innerHTML='<h2>'+title+'</h2>'+body+'<p><button onclick="closePanel()">Закрыть</button></p>';document.getElementById('panel').classList.add('show')}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function bag(){open('🎒 Мешок','<p>Надет: <b>'+p.bag+'</b> • вместимость '+p.cap+'.</p><p>Средний — 30 • Большой — 50 • Очень большой — 80 • Гигантский — 150.</p>')}
function mapPanel(){open('🗺️ Королевство','<p>На карте есть замок и деревня, лес, шахта с рудой, башня мага, повозка, места сражений и точки таинственных торговцев.</p><p>Сейчас главный визуальный фокус Beta 10 — единый живой мир.</p>')}
function pauseGame(){paused=!paused;toast(paused?'Ⅱ Пауза':'▶ Продолжить')}
function combatFx(type,labelText){
 attackKind=type; attack=0.72;
 combat={type,t:0,duration:.72,phase:0};
 let fl=document.getElementById('combatFlash'),lb=document.getElementById('combatLabel');
 lb.textContent=labelText;lb.classList.add('show');fl.style.opacity='.85';
 clearTimeout(combatFx.timer);combatFx.timer=setTimeout(()=>{lb.classList.remove('show');fl.style.opacity='0'},180);
}
function sword(){combatFx('sword','⚔️ УДАР!');toast('⚔️ Меч — мощный замах')}

function rock(){
 if(spend(1,1)){combatFx('rock','🪨 БРОСОК!');toast('🪨 Камень полетел')}
}
function flight(){if(p.fly){p.fly=false;toast('🌀 Полёт выключен');return}if(p.dirt<.5||p.stone<.5){toast('⚠️ Нужно 0.5🟫 и 0.5🪨');return}p.fly=true;toast('🌀 Полёт включён')}
function mineResource(){let o=ores.find(o=>Math.hypot(p.x-o.x,p.y-o.y)<85);if(!o){toast('⛏️ Подойди к руде');return}p.dir=Math.atan2(o.y-p.y,o.x-p.x);pickA=.75;o.h--;toast('⛏️ Удар киркой');note(o.x,o.y-45,'Осталось ударов: '+o.h);if(o.h<=0){let r=Math.random(),n=r<.65?1:r<.9?2:3;note(o.x,o.y-70,n===1?'Маленький кусок':n===2?'Средний кусок':'Большой кусок');addRes(o.type,n);o.h=o.max}}
function interact(){
  // Beta 15.5.5: when Alexander is in the village center, choose the nearest visible resident.
  if(p.x>2600 && p.x<4800 && p.y>700 && p.y<1250){
    let nearest=Math.floor((Math.abs(p.x-3600)/260))%villagers.length;
    let v=villagers[Math.max(0,Math.min(villagers.length-1,nearest))];
    open('💬 '+v.name,'<p><b>'+v.role+'</b></p><p>Привет! Я житель королевства.</p><p>Александр может поговорить со мной и узнать больше о деревне.</p>');
    return;
  }

 let d=Math.hypot(p.x-target.x,p.y-target.y);
 if(d<170){open('👑 Королевский зал','<p>Просторная высокая постройка из мрамора с золотой крышей и большими окнами. Снаружи — цветы и кусты.</p><p>Внутри красный ковёр ведёт к ступеням и королевскому креслу: красная кожа, золотые края, высокая спинка и подлокотники.</p><p>Рядом стоят гвардейцы с копьями, а на кресле сидит король.</p>');return}
 let tr=traders.find(t=>Math.hypot(p.x-t.x,p.y-t.y)<120);
 if(tr){open('🛒 Таинственный торговец',`<p>Торговец резко раскрывает тёмное платье — внутри спрятаны товары.</p><button onclick="buy(500,30,'Средний')">Средний — 500 XP</button><button onclick="buy(777,50,'Большой')">Большой — 777 XP</button><br><button onclick="buy(1000,80,'Очень большой')">Очень большой — 1000 XP</button><button onclick="buy(1500,150,'Гигантский')">Гигантский — 1500 XP</button>`);return}
 
  let nearVillager=villagers.find(v=>Math.hypot(p.x-v.x,p.y-v.y)<85);
  if(nearVillager){
    let isTraitor=traitorIds.has(nearVillager.id);
    open('💬 '+nearVillager.name,
      '<p><b>'+nearVillager.role+'</b></p>'+
      '<p>'+ (isTraitor ? 'Житель дружелюбно разговаривает с Александром. Он кажется надёжным.' : 'Житель занят своими делами и приветствует Александра.') +'</p>'+
      '<p>Сейчас он выглядит совершенно обычным жителем деревни.</p>');
    return;
  }
let o=ores.find(o=>Math.hypot(p.x-o.x,p.y-o.y)<90);if(o){mineResource();return}
}
function buy(cost,cap,name){if(p.xp<cost){toast('❌ Опыта недостаточно');return}p.xp-=cost;p.cap=cap;p.bag=name;hud();toast('🎒 Куплен '+name);closePanel()}

function setup(){
 ores=[
  [760,300,'stone'],[930,350,'stone'],[1060,265,'dirt'],[720,455,'dirt'],[1010,460,'stone'],[1130,360,'stone'],
  [870,405,'stone'],[980,520,'dirt']
 ].map(a=>({x:a[0],y:a[1],type:a[2],h:4,max:4}));
 traders=[{x:1520,y:1410},{x:2280,y:520},{x:2720,y:1480}];
 for(let i=0;i<8;i++)butterflies.push({x:1280+(i*233)%1700,y:250+(i*317)%1750,a:i*.8,s:.6+Math.random()*.5});
}setup();

function move(dt){
 let x=(keys.d?1:0)-(keys.a?1:0)+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),y=(keys.s?1:0)-(keys.w?1:0)+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
 x+=joy.x;y+=joy.y;let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 let sp=p.fly?270:175;p.x=Math.max(30,Math.min(world.w-30,p.x+x*sp*dt));p.y=Math.max(30,Math.min(world.h-30,p.y+y*sp*dt));if(l>.1)p.dir=Math.atan2(y,x);
 if(p.fly){move.t=(move.t||0)+dt;if(move.t>=1){move.t=0;if(!spend(.5,.5)){p.fly=false;toast('⚠️ Ресурсы закончились')}}}
}
function cam(){return{x:Math.max(0,Math.min(world.w-W,p.x-W/2)),y:Math.max(0,Math.min(world.h-H,p.y-H/2))}}
function rect(x,y,w,h,f,s){ctx.fillStyle=f;ctx.fillRect(x,y,w,h);if(s){ctx.strokeStyle=s;ctx.strokeRect(x,y,w,h)}}
function poly(a,f,s){ctx.beginPath();a.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.stroke()}}
function circ(x,y,r,f,s){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();if(s){ctx.strokeStyle=s;ctx.stroke()}}
function label(x,y,t,size=13){ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}

function tree(x,y,s){ctx.fillStyle='#4d3927';ctx.fillRect(x-6,y,s*.32,s*1.6);circ(x,y,s,'#1f4b29','#17351f');circ(x-18,y+12,s*.62,'#2d6537');circ(x+20,y+13,s*.58,'#2d6537')}
function house(x,y){rect(x,y,105,75,'#c9b99c','#604c34');poly([[x-12,y],[x+52,y-55],[x+118,y]],'#7d3e32');rect(x+40,y+38,25,37,'#5a4630');circ(x+22,y+25,9,'#8dc8d5');circ(x+82,y+25,9,'#8dc8d5')}
function castle(){
 rect(80,545,700,430,'#717873','#303530');rect(145,610,570,300,'#d9d4c8','#625c51');
 rect(70,510,105,475,'#656b66');rect(685,510,105,475,'#656b66');
 poly([[210,615],[430,385],[650,615]],'#c9a72d','#765f19');
 rect(340,755,180,150,'#513a2c');rect(235,675,390,80,'#802630');label(430,725,'КРАСНЫЙ КОВЁР',12);
 rect(385,645,90,85,'#992633','#d2ae46');label(430,698,'♛',28);
 for(let x of [280,580]){circ(x,735,18,'#b9c3bf');rect(x-10,753,20,85,'#59645d');}
 for(let i=0;i<16;i++){circ(130+(i%8)*78,935+Math.floor(i/8)*28,6,'#d66fa2');circ(155+(i%8)*78,930+Math.floor(i/8)*28,5,'#8fca65')}
 label(430,1015,'КОРОЛЕВСКИЙ ЗАМОК',20)
}
function renderMine(){
 rect(610,135,600,410,'#5b5146','#292621');rect(665,210,490,290,'#20251f');
 poly([[665,320],[770,205],[850,320],[935,170],[1035,315],[1125,220],[1155,500],[665,500]],'#343c36');
 label(910,575,'ШАХТА',19);label(910,598,'видимые каменные и грязевые жилы',11)
}
function tower(){
 rect(2170,100,400,740,'#81776d','#34352f');for(let y=200;y<780;y+=105)rect(2245,y,250,82,'#645a50','#3b342e');
 poly([[2110,150],[2370,0],[2630,150]],'#54462f','#2e261d');rect(2318,710,105,130,'#4a3528');
 for(let i=0;i<28;i++){let x=2170+(i*67)%400,y=155+(i*131)%610;rect(x,y,9,38,'#2d6337')}
 label(2370,880,'БАШНЯ МАГА',19);label(2370,903,'книги • зелья • травы • комната мага',11)
}
function wagon(){rect(1415,1365,185,95,'#70472f','#c9a45d');circ(1450,1477,28,'#252525');circ(1560,1477,28,'#252525');circ(1510,1328,34,'#d9b98e');label(1510,1518,'ПОВОЗКА',13)}
function ore(o){let col=o.type==='stone'?'#aab2ae':'#855b3c';poly([[o.x-35,o.y+22],[o.x-22,o.y-28],[o.x+12,o.y-42],[o.x+40,o.y-5],[o.x+28,o.y+32]],col,'#313732');label(o.x,o.y+60,'⛏️ '+o.h,11)}
function trader(t){circ(t.x,t.y,28,'#111514','#aab3a8');poly([[t.x-40,t.y-5],[t.x,t.y-65],[t.x+40,t.y-5],[t.x+30,t.y+45],[t.x-30,t.y+45]],'#090a0a');label(t.x,t.y+68,'ТОРГОВЕЦ',10)}
function butterfly(b){b.a+=.018;let x=b.x+Math.sin(b.a)*35,y=b.y+Math.cos(b.a*.8)*24;ctx.strokeStyle=['#ffd34d','#64b8ff','#d28cff','#ff8bb7','#8be36b'][Math.floor(b.a*2)%5]+'88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(b.a)*25,y-Math.sin(b.a)*25);ctx.stroke();circ(x-6,y,5,'#f1e6b0');circ(x+6,y,5,'#f1e6b0');circ(x,y,3,'#333')}
function player(){
  circ(p.x,p.y,21,'#b97850','#2a201b');
  circ(p.x,p.y-28,15,'#68402b');
  rect(p.x-18,p.y+10,36,35,'#3b6072');
  if(p.fly){circ(p.x,p.y,35,'#8dd0ed33','#bfeeff');circ(p.x,p.y,44,'#bfeeff22')}

  let q=combat.duration?Math.min(1,combat.t/combat.duration):0;

  if(combat.type==='sword'&&combat.duration>0){
    let e=q<.28?q/.28:q<.65?1:1-(q-.65)/.35;
    let ang=p.dir-1.8+e*3.25;
    ctx.save();ctx.translate(p.x,p.y-2);ctx.rotate(ang);
    ctx.strokeStyle='#b97850';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(28,0);ctx.stroke();
    ctx.strokeStyle='#d3aa55';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(27,-11);ctx.lineTo(27,11);ctx.stroke();
    ctx.strokeStyle='#f2f5f2';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(105,0);ctx.stroke();
    ctx.restore();
    if(q>.25&&q<.72){
      ctx.save();ctx.translate(p.x,p.y-2);ctx.rotate(p.dir);
      ctx.strokeStyle='#ffffffcc';ctx.lineWidth=7;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(42,0,82,-1.15,1.15);ctx.stroke();
      ctx.restore();
    }
  }

  if(combat.type==='rock'&&combat.duration>0){
    ctx.save();ctx.translate(p.x,p.y-3);ctx.rotate(p.dir);
    let arm=q<.35?q/.35:1;
    ctx.strokeStyle='#b97850';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(31+arm*18,0);ctx.stroke();ctx.restore();
    if(q>.22){
      let t=(q-.22)/.78,d=38+t*210;
      let sx=p.x+Math.cos(p.dir)*d,sy=p.y+Math.sin(p.dir)*d-20*Math.sin(t*Math.PI);
      circ(sx,sy,11,'#aaa092','#3c3832');
      if(t>.05){ctx.strokeStyle='#cfc5b477';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx-Math.cos(p.dir)*35,sy-Math.sin(p.dir)*35);ctx.lineTo(sx,sy);ctx.stroke()}
    }
  }

  if(pickA>0){
    let t=1-pickA/.75,ang=-1.25+Math.sin(Math.min(1,t)*Math.PI)*2.5;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
    ctx.strokeStyle='#9b6d45';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(58,5);ctx.stroke();
    ctx.strokeStyle='#bfc7c5';ctx.lineWidth=9;
    ctx.beginPath();ctx.moveTo(50,-18);ctx.lineTo(72,18);ctx.stroke();
    ctx.restore();
  }
}

// Beta 15.5.5 — NPC Fix: visible village residents
const npcSpots=[
  [-170,-95],[-85,-125],[0,-105],[85,-125],[170,-95],
  [-190,20],[-95,35],[0,25],[95,35],[190,20]
];
function drawVillagers(){
  npcSpots.forEach((s,i)=>{
    const sx=canvas.width/2+s[0], sy=canvas.height/2+s[1];
    const v=villagers[i];
    const bob=Math.sin(performance.now()/700+i)*3;
    // shadow
    ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(sx,sy+28,18,7,0,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.globalAlpha=1;
    // body and head
    ctx.fillStyle=v.color;ctx.fillRect(sx-13,sy+2+bob,26,32);
    ctx.fillStyle='#b97850';ctx.beginPath();ctx.arc(sx,sy-10+bob,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#68402b';ctx.beginPath();ctx.arc(sx,sy-17+bob,13,Math.PI,Math.PI*2);ctx.fill();
    // name + role
    ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText(v.name,sx,sy-30+bob);
    ctx.fillStyle='#ddd';ctx.font='10px sans-serif';ctx.fillText(v.role,sx,sy+48+bob);
  });
}
function draw(){
 ctx.clearRect(0,0,W,H);let C=cam();ctx.save();ctx.translate(-C.x,-C.y);
 rect(0,0,world.w,world.h,'#2d5a31');
 for(let i=0;i<110;i++){let x=(i*251)%world.w,y=(i*149)%world.h;circ(x,y,30+(i%4)*12,'#32633655')}
 // mountains
 for(let i=0;i<9;i++){let x=180+i*410;poly([[x,430],[x+190,80+(i%3)*50],[x+380,430]],'#395342','#243c2b')}
 // river
 ctx.strokeStyle='#397fa8';ctx.lineWidth=110;ctx.beginPath();ctx.moveTo(1330,0);ctx.bezierCurveTo(1170,400,1510,650,1320,1080);ctx.bezierCurveTo(1110,1450,1460,1780,1260,2400);ctx.stroke();
 // roads
 ctx.strokeStyle='#9a7b4d';ctx.lineWidth=72;ctx.beginPath();ctx.moveTo(350,900);ctx.lineTo(780,790);ctx.lineTo(940,540);ctx.stroke();ctx.beginPath();ctx.moveTo(700,800);ctx.lineTo(1500,980);ctx.lineTo(2070,1110);ctx.stroke();
 // forest
 for(let i=0;i<95;i++){let x=1380+(i*173)%2050,y=120+(i*313)%2050;if(x>2080&&y<880)continue;tree(x,y,35+(i%4)*7)}
 // village
 for(let i=0;i<12;i++){let x=180+(i%4)*150,y=1100+Math.floor(i/4)*145;house(x,y)}
 label(520,1070,'СРЕДНЕВЕКОВАЯ ДЕРЕВНЯ',18);
 castle();renderMine();tower();wagon();
 circ(1850,980,130,'#1b332955','#9bb59c');label(1850,835,'МЕСТО БИТВЫ',14);
 circ(2050,1120,115,'#18373b55','#83c0c8');label(2050,980,'ТАИНСТВЕННЫЙ',14);
 ores.forEach(ore);traders.forEach(trader);butterflies.forEach(butterfly);drawVillagers();
player();
 ctx.restore();
 ctx.save();ctx.translate(-C.x,-C.y);notes.forEach(n=>{ctx.globalAlpha=n.l;label(n.x,n.y,n.t,14)});ctx.restore();
}
function update(dt){
 if(paused)return;
 time+=dt;move(dt);attack=Math.max(0,attack-dt);pickA=Math.max(0,pickA-dt);
 if(combat.t>0 || combat.duration>0){
   combat.t+=dt;
   combat.phase=Math.min(1,combat.t/combat.duration);
   if(combat.t>=combat.duration){combat.duration=0;combat.t=0}
 }
 notes.forEach(n=>{n.l-=dt;n.y-=18*dt});notes=notes.filter(n=>n.l>0);hud();
 let C=cam(),sx=target.x-C.x,sy=target.y-C.y,ang=Math.atan2(sy-H/2,sx-W/2),ar=document.getElementById('arrow');
 if(Math.hypot(sx-W/2,sy-H/2)<180)ar.style.display='none';
 else{ar.style.display='block';ar.style.left=(W/2+Math.cos(ang)*Math.min(W,H)*.37)+'px';ar.style.top=(H/2+Math.sin(ang)*Math.min(W,H)*.37)+'px';ar.style.transform='translate(-50%,-50%) rotate('+ang+'rad)'}
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);

let tid=null;const j=document.getElementById('joy');
function setJoy(x,y){let r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=r.width*.31;if(l>m){dx=dx/l*m;dy=dy/l*m}document.getElementById('knob').style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/m;joy.y=dy/m}
j.addEventListener('touchstart',e=>{tid=e.changedTouches[0].identifier;let q=e.changedTouches[0];setJoy(q.clientX,q.clientY)},{passive:true});
j.addEventListener('touchmove',e=>{for(let q of e.changedTouches)if(q.identifier===tid)setJoy(q.clientX,q.clientY)},{passive:true});
j.addEventListener('touchend',()=>{tid=null;joy.x=joy.y=0;document.getElementById('knob').style.transform='translate(0,0)'},{passive:true});
hud();
</script>

<style>
#combatFlash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,60,40,0) 55%);transition:opacity .08s}
#combatLabel{position:fixed;z-index:56;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:1000;text-shadow:0 3px 10px #000;opacity:0;pointer-events:none;transition:.16s}
#combatLabel.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<div id="combatFlash"></div><div id="combatLabel"></div>
<script>
/*
 ALEXANDER RPG — BETA 15.5 COMBAT UPDATE
 This layer provides the combat primitives used by the upgraded combat systems:
 - timed attack phases
 - visible player weapon/tool animation
 - projectile travel from Alexander's hand
 - red telegraphs before enemy attacks
 - distance-aware enemy attack selection
 - Alpha Wolf / pack command state
 - Stone Monster self-piece projectile + regeneration state
*/
window.AlexCombat15_5 = (() => {
  const S={player:null,mobs:[],projectiles:[],fx:[],telegraphs:[],cooldowns:{},
           constants:{
             wolfDodge:.35,
             wolfAttackDelay:.7,wolfCooldown:1,
             boarChargeSpeed:520,boarChargeTime:.48,
             bigBoarChargeSpeed:460,bigBoarRearDamage:34,
             stoneThrowRange:520,stoneRegenDelay:3,
             telegraphTime:.7
           }};
  const $=id=>document.getElementById(id);
  function flash(text){
    const f=$('combatFlash'),l=$('combatLabel');
    if(f){f.style.opacity=.75;setTimeout(()=>f.style.opacity=0,90)}
    if(l){l.textContent=text;l.classList.add('show');setTimeout(()=>l.classList.remove('show'),240)}
  }
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function telegraph(owner,shape,opts={}){
    const t={owner,shape,ttl:opts.duration||S.constants.telegraphTime,
      x:opts.x??owner.x,y:opts.y??owner.y,
      x2:opts.x2??owner.x,y2:opts.y2??owner.y,
      width:opts.width||60,radius:opts.radius||100,angle:opts.angle||0};
    S.telegraphs.push(t); return t;
  }
  function projectile(from,to,opts={}){
    const sx=from.x,sy=from.y,tx=to.x,ty=to.y;
    S.projectiles.push({x:sx,y:sy,tx,ty,t:0,duration:opts.duration||.38,
      damage:opts.damage||0,radius:opts.radius||10,label:opts.label||'🪨',
      onHit:opts.onHit||null});
  }
  function playerSword(){
    const p=S.player;if(!p)return;
    p.combat={kind:'sword',phase:0,t:0,duration:.42};
    flash('⚔️');
  }
  function playerPick(){
    const p=S.player;if(!p)return;
    p.combat={kind:'pickaxe',phase:0,t:0,duration:.58};
    flash('⛏️');
  }
  function playerRock(target){
    const p=S.player;if(!p||!target)return;
    p.combat={kind:'rock',phase:0,t:0,duration:.55};
    setTimeout(()=>{
      const hand={x:p.x+Math.cos(p.dir||0)*22,y:p.y+Math.sin(p.dir||0)*22-12};
      projectile(hand,target,{duration:.42,damage:18,label:'🪨'});
    },240);
    flash('🪨');
  }
  function chooseMeleeOrLeap(m,d){
    if(d>90)return 'leap';
    return Math.random()<.75?'claw':'leap';
  }
  function wolfThink(m,p){
    const d=dist(m,p);
    if(d>75)return 'chase';
    return chooseMeleeOrLeap(m,d);
  }
  function alphaCommand(alpha,pack,p){
    const d=dist(alpha,p);
    if(d<420){
      for(const w of pack) w.packCommand={type:'surround',until:performance.now()+3200};
      return 'surround';
    }
    return 'normal';
  }
  function stoneThrow(m,p){
    const d=dist(m,p);
    if(d<=S.constants.stoneThrowRange){
      telegraph(m,'line',{x2:p.x,y2:p.y,width:55});
      setTimeout(()=>{
        const piece={x:m.x,y:m.y};
        projectile(piece,p,{duration:.55,damage:30,label:'🪨',onHit:()=>{}});
      },S.constants.telegraphTime*1000);
      return true;
    }
    return false;
  }
  function stoneRegenerate(m){
    if(m.regenPending)return;
    m.regenPending=true;
    setTimeout(()=>{
      if(m.dead)return;
      m.hp=Math.min(m.maxHp,m.hp+(m.regenAmount||25));
      m.regenPending=false;
    },S.constants.stoneRegenDelay*1000);
  }
  function update(dt){
    for(const t of S.telegraphs)t.ttl-=dt;
    S.telegraphs=S.telegraphs.filter(t=>t.ttl>0);
    for(const q of S.projectiles){
      q.t+=dt/q.duration;
      const k=clamp(q.t,0,1),h=4*Math.sin(Math.PI*k);
      q.x=q.x+(q.tx-q.x)*0; // retained for stable object identity
      q.renderX=q._sx+(q.tx-q._sx)*k;
      q.renderY=q._sy+(q.ty-q._sy)*k-h*22;
    }
    S.projectiles=S.projectiles.filter(q=>q.t<1);
    for(const f of S.fx)f.t-=dt;
    S.fx=S.fx.filter(f=>f.t>0);
    if(S.player?.combat){
      S.player.combat.t+=dt;
      S.player.combat.phase=clamp(S.player.combat.t/S.player.combat.duration,0,1);
      if(S.player.combat.phase>=1)S.player.combat=null;
    }
  }
  function bindPlayer(p){S.player=p}
  function bindMobs(m){S.mobs=m}
  function prepareProjectiles(){
    for(const q of S.projectiles){
      if(q._sx===undefined){q._sx=q.x;q._sy=q.y}
    }
  }
  return {S,update,bindPlayer,bindMobs,telegraph,projectile,playerSword,playerPick,playerRock,
          wolfThink,alphaCommand,stoneThrow,stoneRegenerate,prepareProjectiles};
})();
</script>
