<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Александр RPG — Beta 17</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:20;left:10px;top:max(8px,env(safe-area-inset-top));padding:9px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-size:12px;line-height:1.45;text-shadow:1px 1px #000;pointer-events:none}
#title{position:fixed;z-index:20;right:10px;top:max(8px,env(safe-area-inset-top));padding:8px 11px;background:#07100ddd;border:1px solid #c8d3c288;border-radius:12px;font-weight:900;font-size:12px;pointer-events:none}
#quest{position:fixed;z-index:20;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 12px;background:#07100ddd;border:1px solid #d4c47b99;border-radius:12px;font-size:12px;font-weight:900;pointer-events:none;white-space:nowrap}
#settingsBtn{position:fixed;z-index:35;right:10px;top:58px;width:48px;height:48px;padding:0;font-size:20px}
#moveZone{position:fixed;z-index:29;left:10px;bottom:max(10px,env(safe-area-inset-bottom));width:190px;height:150px;border:2px dashed #c7d4c055;border-radius:28px;background:#07100b22;display:none;touch-action:none}
#editHint{position:fixed;z-index:80;left:50%;top:10%;transform:translateX(-50%);padding:10px 14px;background:#07100df0;border:1px solid #c8d3c2aa;border-radius:12px;display:none;font-weight:900}
#buttons{position:fixed;z-index:30;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(250px,43vw)}
button{border:1px solid #c8d3c2;background:#172219ed;color:#fff;border-radius:14px;padding:11px 8px;font-weight:900;font-size:12px;box-shadow:0 6px 16px #0009}
button:active{transform:scale(.95);background:#41553f}
#joy{position:fixed;z-index:30;left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid #c7d4c055;background:#07100b88}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;left:35px;top:35px;background:#dfe8dcaa;border:1px solid #fff8}
#arrow{position:fixed;z-index:25;display:none;font-size:42px;text-shadow:0 0 12px #58aaff,0 3px 8px #000;pointer-events:none}
#toast{position:fixed;z-index:60;left:50%;top:29%;transform:translate(-50%,-12px);padding:8px 12px;background:#050805ef;border:1px solid #d2dec9aa;border-radius:10px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:#020403e8;padding:18px}
#panel.show{display:flex}.card{width:min(580px,94vw);max-height:86vh;overflow:auto;background:#1b241d;border:1px solid #bac8b4;border-radius:18px;padding:18px;box-shadow:0 20px 70px #000}
.card h2{margin:0 0 10px}.card p,.card li{line-height:1.45}.card button{margin:4px}

/* Beta 11 combat feedback */
#combatFlash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.34),rgba(255,80,40,0) 55%);transition:opacity .08s}
#combatLabel{position:fixed;z-index:56;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:1000;text-shadow:0 3px 10px #000;opacity:0;pointer-events:none;transition:.16s}
#combatLabel.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Beta 14 — Living World NPCs */
.npcTag{font-weight:900;text-shadow:0 2px 5px #000}
.traitorHint{color:#ff7777;font-weight:900}
</style>
<style>html,body,#game{touch-action:none;-webkit-user-select:none;user-select:none}</style>

<style>
#b17Panel{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);
width:min(92vw,460px);max-height:84vh;overflow:auto;background:#07100df5;border:1px solid #c8d3c2aa;
border-radius:18px;padding:16px;box-shadow:0 14px 50px #000a;display:none;color:#eef4ea}
#b17Panel h2{margin:0 0 10px;font-size:20px}
#b17Panel .b17Ability{padding:10px;margin:7px 0;border:1px solid #ffffff22;border-radius:12px;background:#ffffff08}
#b17Panel button{margin:4px;padding:8px 10px;border-radius:10px;border:1px solid #ffffff33;background:#ffffff12;color:inherit}
#b17Bar{position:fixed;z-index:31;right:10px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;width:min(48vw,300px)}
#b17Bar button{min-width:50px;min-height:50px;border-radius:14px;font-size:18px;background:#07100db8;color:#fff;border:1px solid #ffffff44}
#b17Msg{position:fixed;z-index:90;left:50%;top:14%;transform:translateX(-50%);padding:10px 14px;
background:#07100df2;border:1px solid #c8d3c2aa;border-radius:12px;display:none;font-weight:900;text-align:center}
#b17HandControls{position:fixed;z-index:65;left:50%;bottom:18%;transform:translateX(-50%);display:none;gap:12px;align-items:center}
#b17HandControls button{font-size:18px;padding:12px 16px;border-radius:14px;border:1px solid #ffffff55;background:#07100ddd;color:#fff}
#b17HandStick{width:140px;height:110px;border:2px dashed #c8d3c255;border-radius:22px;background:#ffffff08;touch-action:none}
</style>

<style id="b171-hand-grab-fix">
#b17HandStick{touch-action:none;user-select:none;-webkit-user-select:none}
#b17HandControls button{min-width:72px;min-height:44px;font-size:16px}
</style>

<body>
<canvas id="game"></canvas>
<div id="hud"></div><div id="title">ALEXANDER RPG • BETA 17.1 FIXED</div>
<div id="quest">👑 Цель: королевский замок</div><div id="arrow">➤</div><div id="toast"></div><div id="combatFlash"></div><div id="combatLabel"></div>
<div id="joy"><div id="knob"></div></div>
<button id="settingsBtn" onclick="openSettings()" aria-label="Настройки">⚙️</button><button id="b17AbilityOpen" style="position:fixed;z-index:35;right:10px;top:112px;width:48px;height:48px;padding:0;font-size:20px" onclick="b17OpenAbilities()">✨</button>
<div id="moveZone"></div><div id="editHint">🛠️ Перетащите кнопки • Нажмите «Сохранить»</div>
<div id="buttons">
<button onclick="interact()">◉ Взаимодействие</button>
<button onclick="sword()">⚔️ Меч</button>
<button onclick="rock()">🪨 Бросок</button>
<button onclick="flight()">🌀 Полёт</button>
<button id="pickaxeBtn" onclick="mineResource()">⛏️ Кирка</button>
<button onclick="bag()">🎒 Мешок</button>

<button onclick="pauseGame()">Ⅱ Пауза</button>
</div>
<div id="panel"><div class="card" id="card"></div></div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const world={w:3600,h:2400};
const p={x:540,y:1010,dir:0,level:0,xp:0,dirt:7,stone:8,cap:20,bag:'Начальный (маленький)',fly:false,gold:0,hp:100,maxHp:100};
const bags={'Начальный (маленький)':20,'Средний':30,'Большой':50,'Очень большой':80,'Гигантский':150};
const target=null;
const king={x:430,y:790};
const keys={},joy={x:0,y:0};let paused=false,attack=0,attackKind='',pickA=0,time=0,last=performance.now();
let notes=[],ores=[],traders=[],butterflies=[],particles=[];
let combat={type:'',t:0,duration:0,phase:0};
let traitorCount=0, traitorIds=new Set();
// ===== BETA 15: жители, золото, квесты, доверие и мобы =====
const QUEST_REWARD_MIN=50, QUEST_REWARD_MAX=500;
const villagers=[
 {id:1,name:'Илья',role:'Фермер',color:'#2f6fb0',x:420,y:1130,trust:0,quest:null},
 {id:2,name:'Борис',role:'Лесоруб',color:'#3f8f52',x:575,y:1130,trust:0,quest:null},
 {id:3,name:'Марк',role:'Торговец',color:'#d6b52e',x:730,y:1130,trust:0,quest:null},
 {id:4,name:'Роман',role:'Кузнец',color:'#a83b3b',x:420,y:1275,trust:0,quest:null},
 {id:5,name:'Лев',role:'Алхимик',color:'#7445a8',x:575,y:1275,trust:0,quest:null},
 {id:6,name:'Степан',role:'Шахтёр',color:'#76513a',x:730,y:1275,trust:0,quest:null},
 {id:7,name:'Данил',role:'Целитель',color:'#e8e8e8',x:420,y:1420,trust:0,quest:null},
 {id:8,name:'Олег',role:'Охотник',color:'#d47b24',x:575,y:1420,trust:0,quest:null},
 {id:9,name:'Фёдор',role:'Рыбак',color:'#4aa8c7',x:730,y:1420,trust:0,quest:null},
 {id:10,name:'Пётр',role:'Пекарь',color:'#d889a9',x:575,y:1565,trust:0,quest:null}
];
const mobDefs={
 wolf:{name:'Волк',hp:55,maxHp:55,speed:150,damage:10,range:70,windup:.7,cooldown:1,turn:.9},
 alpha:{name:'Альфа-волк',hp:190,maxHp:190,speed:125,damage:20,range:82,windup:.9,cooldown:1.4,turn:.65},
 bear:{name:'Медведь',hp:240,maxHp:240,speed:75,damage:28,range:92,windup:1.1,cooldown:1.8,turn:.45},
 boar:{name:'Кабан',hp:80,maxHp:80,speed:205,damage:18,range:105,windup:.8,cooldown:1.5,turn:.25},
 bigboar:{name:'Большой кабан',hp:260,maxHp:260,speed:180,damage:34,range:115,windup:1,cooldown:2,turn:.18},
 stone:{name:'Каменный монстр',hp:320,maxHp:320,speed:48,damage:32,range:115,windup:1.25,cooldown:2.3,turn:.35}
};
let mobs=[],spawnTimer=0,questState=null,attackWarnings=[],mysterious={x:1510,y:1260,met:false};
const mobCaps={boar:2,bigboar:1,stone:1,wolf:3,alpha:2,bear:2};
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function countType(t){return mobs.filter(m=>m.type===t).length}
function spawnMob(type,x,y){
 const d=mobDefs[type]; if(!d || countType(type)>=mobCaps[type]) return false;
 mobs.push({type,x,y,hp:d.hp,maxHp:d.maxHp,speed:d.speed,damage:d.damage,range:d.range,windup:d.windup,cooldown:d.cooldown,turn:d.turn,cd:Math.random(),warn:0,attackT:0,attackAngle:0,state:'idle',special:0});
 return true;
}
function randomMobSpawn(){
 const eligible=Object.keys(mobCaps).filter(t=>countType(t)<mobCaps[t]);
 if(!eligible.length)return;
 const type=eligible[Math.floor(Math.random()*eligible.length)];
 const zones={
  wolf:[1250,900,500,700],alpha:[1250,900,700,900],bear:[1000,800,1000,700],
  boar:[850,1500,700,650],bigboar:[900,1450,900,650],stone:[650,220,560,350]
 };
 const z=zones[type]; let x=z[0]+Math.random()*z[2],y=z[1]+Math.random()*z[3];
 spawnMob(type,x,y);
}
function setQuest(v){
 const q=v.id===1?{type:'defend',text:'Защити мой урожай от волков',target:2,done:0,reward:Math.floor(QUEST_REWARD_MIN+Math.random()*(QUEST_REWARD_MAX-QUEST_REWARD_MIN+1))}: {type:'hunt',text:'Помоги королевству: победи 1 дикого зверя',target:1,done:0,reward:Math.floor(QUEST_REWARD_MIN+Math.random()*(QUEST_REWARD_MAX-QUEST_REWARD_MIN+1))};
 v.quest=q; questState={villager:v.id,q};
 if(v.id===1){spawnMob('wolf',360,1020);spawnMob('wolf',650,1020)}
 updateQuestUI();
}
const mobXP={wolf:5000,alpha:15000,bear:10000,boar:6000,bigboar:12000,stone:18000};
function syncAbilityState(){
 if(typeof B17!=='undefined'){ B17.level=p.level; B17.xp=p.xp; b17Save(); }
}
function addPlayerXP(amount,reason=''){
 amount=Math.max(0,Math.floor(Number(amount)||0)); if(!amount)return;
 p.xp+=amount;
 while(p.xp>=nextXP()){p.xp-=nextXP();p.level++; toast('✨ Уровень '+p.level+'!');}
 syncAbilityState(); hud();
}
function completeQuest(v){
 if(!v.quest || v.quest.done<v.quest.target)return;
 const reward=v.quest.reward; const xpReward=10000+v.id*500;
 p.gold+=reward; v.trust=Math.min(100,v.trust+10); addPlayerXP(xpReward,'quest');
 v.quest=null;if(questState&&questState.villager===v.id)questState=null;
 villagers.forEach(o=>{if(o.id!==v.id)o.trust=Math.min(100,o.trust+1)});
 toast('🪙 +'+reward+' золота • ⭐ +'+xpReward+' XP • ❤️ доверие +10');
 updateQuestUI();hud();
}
function damageMob(m,amount){
 m.hp-=amount;note(m.x,m.y-55,'-'+Math.round(amount)+' HP');
 if(m.hp<=0){
   mobs=mobs.filter(x=>x!==m); addPlayerXP(mobXP[m.type]||50,'mob');
   if(questState){
     if(questState.q.type==='defend' && m.type!=='wolf'){} else questState.q.done++;
     if(questState.q.done>=questState.q.target){let v=villagers.find(v=>v.id===questState.villager);if(v)completeQuest(v);}
   }
   toast('⚔️ '+mobDefs[m.type].name+' побеждён • ⭐ +'+(mobXP[m.type]||50)+' XP');
 }
 hud();
}
function playerAttackHit(){
 const range=125, cone=.95;
 mobs.slice().forEach(m=>{const d=dist(p,m),a=Math.atan2(m.y-p.y,m.x-p.x);let da=Math.atan2(Math.sin(a-p.dir),Math.cos(a-p.dir));if(d<range&&Math.abs(da)<cone)damageMob(m,35)});
 if(questState&&questState.q.type==='hunt'&&questState.q.done>=questState.q.target){let v=villagers.find(v=>v.id===questState.villager);if(v)completeQuest(v)}
}
function playerRockHit(){
 const range=390;
 let best=null,bd=1e9;
 mobs.forEach(m=>{let d=dist(p,m),a=Math.atan2(m.y-p.y,m.x-p.x),da=Math.atan2(Math.sin(a-p.dir),Math.cos(a-p.dir));if(d<range&&Math.abs(da)<.35&&d<bd){best=m;bd=d}});
 if(best)damageMob(best,24);
}

function chooseTraitors(){
  // 0..3 traitors, with fewer traitors more common.
  let r=Math.random();
  traitorCount = r<0.45?0:r<0.78?1:r<0.95?2:3;
  let pool=[...villagers];
  while(traitorIds.size<traitorCount){
    let n=pool[Math.floor(Math.random()*pool.length)];
    traitorIds.add(n.id);
  }
}
chooseTraitors();
setTimeout(()=>toast('🏘️ Жители деревни появились'),900);


function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1250)}
function nextXP(){return 100+p.level*10}
function hud(){document.getElementById('hud').innerHTML='<b>Александр</b><br>❤️ '+Math.max(0,Math.ceil(p.hp))+' / '+p.maxHp+'<br>Уровень: '+p.level+' • XP: '+Math.floor(p.xp)+' / '+nextXP()+'<br>🪙 '+p.gold+' золотых<br>🟫 '+p.dirt.toFixed(1)+' • 🪨 '+p.stone.toFixed(1)+' / '+p.cap+'<br>🎒 '+p.bag} 
function note(x,y,t){notes.push({x,y,t,l:1})}
function addRes(type,n){let room=Math.max(0,p.cap-p.dirt-p.stone),g=Math.min(n,room);if(!g){toast('🎒 Мешок заполнен');return}p[type]+=g;note(p.x+Math.random()*80-40,p.y-45,'+'+g+(type==='stone'?'🪨':'🟫'));hud()}
function spend(a,b){if(p.dirt<a||p.stone<b){toast('⚠️ Недостаточно ресурсов');return false}p.dirt-=a;p.stone-=b;hud();return true}
function open(title,body){document.getElementById('card').innerHTML='<h2>'+title+'</h2>'+body+'<p><button onclick="closePanel()">Закрыть</button></p>';document.getElementById('panel').classList.add('show')}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function bag(){open('🎒 Мешок','<p>Надет: <b>'+p.bag+'</b> • вместимость '+p.cap+'.</p><p>Средний — 30 • Большой — 50 • Очень большой — 80 • Гигантский — 150.</p>')}
function mapPanel(){open('🗺️ Королевство','<p>На карте есть замок и деревня, лес, шахта с рудой, башня мага, повозка, места сражений и точки таинственных торговцев.</p><p>Beta 15 — жители, квесты, доверие, золото и опасные мобы.</p>')}
function pauseGame(){paused=!paused;toast(paused?'Ⅱ Пауза':'▶ Продолжить')}
function combatFx(type,labelText){
 attackKind=type; attack=0.72;
 combat={type,t:0,duration:.72,phase:0};
 let fl=document.getElementById('combatFlash'),lb=document.getElementById('combatLabel');
 lb.textContent=labelText;lb.classList.add('show');fl.style.opacity='.85';
 clearTimeout(combatFx.timer);combatFx.timer=setTimeout(()=>{lb.classList.remove('show');fl.style.opacity='0'},180);
}
function sword(){combatFx('sword','⚔️ УДАР!');setTimeout(playerAttackHit,180);toast('⚔️ Меч — мощный замах')}

function rock(){
 if(spend(1,1)){combatFx('rock','🪨 БРОСОК!');setTimeout(playerRockHit,300);toast('🪨 Магический камень полетел дальше')}
}
function flight(){if(p.fly){p.fly=false;toast('🌀 Полёт выключен');return}if(p.dirt<.5||p.stone<.5){toast('⚠️ Нужно 0.5🟫 и 0.5🪨');return}p.fly=true;toast('🌀 Полёт включён')}
function mineResource(){let o=ores.find(o=>Math.hypot(p.x-o.x,p.y-o.y)<85);if(!o){toast('⛏️ Подойди к руде');return}p.dir=Math.atan2(o.y-p.y,o.x-p.x);pickA=.75;o.h--;toast('⛏️ Удар киркой');note(o.x,o.y-45,'Осталось ударов: '+o.h);if(o.h<=0){let r=Math.random(),n=r<.65?1:r<.9?2:3;note(o.x,o.y-70,n===1?'Маленький кусок':n===2?'Средний кусок':'Большой кусок');addRes(o.type,n);o.h=o.max}}
function interact(){
 if(dist(p,king)<100){ open('👑 Король','<p>«Александр, тебе предстоит узнать, что происходит за пределами королевства.»</p><p>Теперь у тебя есть доступ к навигатору и новым заданиям.</p>'); return; }
 let nearVillager=villagers.find(v=>dist(p,v)<95);
 if(nearVillager){
   let v=nearVillager;
   let questHtml=v.quest
    ? '<p>📜 <b>Задание:</b> '+v.quest.text+'</p><p>Прогресс: '+v.quest.done+' / '+v.quest.target+'<br>🪙 Награда: '+v.quest.reward+'</p>'
    : '<p>📜 <b>Квест:</b> '+(v.id===1?'Защити мой урожай от волков.':'Помоги жителю королевства.')+'</p><button onclick="setQuest(villagers.find(x=>x.id==='+v.id+'))">Принять квест</button>';
   if(v.quest&&v.quest.done>=v.quest.target) questHtml+='<button onclick="completeQuest(villagers.find(x=>x.id==='+v.id+'))">Получить награду</button>';
   open('💬 '+v.name,'<p><b>'+v.role+'</b></p><p>❤️ Доверие: '+v.trust+' / 100</p>'+questHtml);
   return;
 }
 if(dist(p,mysterious)<110){
   if(!mysterious.met){
     mysterious.met=true;
     open('🧙 Таинственный человек','<p>«Человек, который слишком долго идёт по одной дороге.»</p><p>— Ты знаешь дорогу к замку?</p><p>«Знаю. Но тебе нужно найти её самому.»</p><p>Он смотрит на повозку.</p><p>«Не всё, что растёт из земли, является травой.»</p>');
   } else open('🧙 Таинственный человек','<p>«Если ты продолжишь идти — обязательно.»</p><p>💧 Его присутствие кажется необычным. Вода вокруг повозки едва заметно движется.</p>');
   return;
 }
 let d=dist(p,target);
 if(d<170){open('👑 Королевский зал','<p>Просторная высокая постройка из мрамора с золотой крышей и большими окнами.</p><p>Главная цель Александра — добраться до королевского замка.</p>');return}
 let o=ores.find(o=>dist(p,o)<90);if(o){mineResource();return}
}
function buy(cost,cap,name){toast('🎒 В Beta 15 мешки покупаются за золото');}

 ores=[

function player(){
  circ(p.x,p.y,21,'#b97850','#2a201b');
  circ(p.x,p.y-28,15,'#68402b');
  rect(p.x-18,p.y+10,36,35,'#3b6072');
  if(p.fly){circ(p.x,p.y,35,'#8dd0ed33','#bfeeff');circ(p.x,p.y,44,'#bfeeff22')}

  let q=combat.duration?Math.min(1,combat.t/combat.duration):0;

  if(combat.type==='sword'&&combat.duration>0){
    let e=q<.28?q/.28:q<.65?1:1-(q-.65)/.35;
    let ang=p.dir-1.8+e*3.25;
    ctx.save();ctx.translate(p.x,p.y-2);ctx.rotate(ang);
    ctx.strokeStyle='#b97850';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(28,0);ctx.stroke();
    ctx.strokeStyle='#d3aa55';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(27,-11);ctx.lineTo(27,11);ctx.stroke();
    ctx.strokeStyle='#f2f5f2';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(105,0);ctx.stroke();
    ctx.restore();
    if(q>.25&&q<.72){
      ctx.save();ctx.translate(p.x,p.y-2);ctx.rotate(p.dir);
      ctx.strokeStyle='#ffffffcc';ctx.lineWidth=7;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(42,0,82,-1.15,1.15);ctx.stroke();
      ctx.restore();
    }
  }

  if(combat.type==='rock'&&combat.duration>0){
    ctx.save();ctx.translate(p.x,p.y-3);ctx.rotate(p.dir);
    let arm=q<.35?q/.35:1;
    ctx.strokeStyle='#b97850';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(31+arm*18,0);ctx.stroke();ctx.restore();
    if(q>.22){
      let t=(q-.22)/.78,d=38+t*210;
      let sx=p.x+Math.cos(p.dir)*d,sy=p.y+Math.sin(p.dir)*d-20*Math.sin(t*Math.PI);
      circ(sx,sy,11,'#aaa092','#3c3832');
      if(t>.05){ctx.strokeStyle='#cfc5b477';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx-Math.cos(p.dir)*35,sy-Math.sin(p.dir)*35);ctx.lineTo(sx,sy);ctx.stroke()}
    }
  }

  if(pickA>0){
    let t=1-pickA/.75,ang=-1.25+Math.sin(Math.min(1,t)*Math.PI)*2.5;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
    ctx.strokeStyle='#9b6d45';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(58,5);ctx.stroke();
    ctx.strokeStyle='#bfc7c5';ctx.lineWidth=9;
    ctx.beginPath();ctx.moveTo(50,-18);ctx.lineTo(72,18);ctx.stroke();
    ctx.restore();
  }
}

function mobAI(dt){
  mobs.slice().forEach(m=>{
    // Stone Hand owns the mob while it is held.
    if(m._b17Held){
      m.attackT=0;
      return;
    }
    // After release, let the throw travel through the world before normal AI resumes.
    if(m._b17ThrownUntil && performance.now()<m._b17ThrownUntil){
      m.x+=m._b17ThrowVX*dt;
      m.y+=m._b17ThrowVY*dt;
      m._b17ThrowVX*=Math.pow(0.985,dt*60);
      m._b17ThrowVY*=Math.pow(0.985,dt*60);
      m.x=Math.max(20,Math.min(world.w-20,m.x));
      m.y=Math.max(20,Math.min(world.h-20,m.y));
      return;
    }
    if(m._b17ThrownUntil){
      m._b17ThrownUntil=0;
      m._b17ThrowVX=0;m._b17ThrowVY=0;
    }
    const d=mobDefs[m.type],dx=p.x-m.x,dy=p.y-m.y,dd=Math.hypot(dx,dy);
    m.cd=Math.max(0,m.cd-dt);m.warn=Math.max(0,m.warn-dt);
    if(m.attackT>0){
      m.attackT-=dt;
      if(m.attackT<=0){
        let hit=false;
        if(m.type==='boar'||m.type==='bigboar'){hit=dd<150 && Math.abs(Math.atan2(Math.sin(m.attackAngle-p.dir),Math.cos(m.attackAngle-p.dir)))<1.2}
        else hit=dd<d.range*1.35 && Math.abs(Math.atan2(Math.sin(m.attackAngle-Math.atan2(dy,dx)),Math.cos(m.attackAngle-Math.atan2(dy,dx))))<.75;
        if(hit){p.hp=Math.max(0,p.hp-m.damage);toast('💥 '+d.name+' нанёс '+m.damage+' урона');}
        m.state='idle';
      }
      return;
    }
    if(dd<430){
      if(m.cd<=0){
        m.attackAngle=Math.atan2(dy,dx);
        m.warn=d.windup;
        m.attackT=d.windup;
        m.cd=d.cooldown;
        // boar charge, other mobs use warning direction
        if(m.type==='boar'||m.type==='bigboar')m.attackAngle=Math.atan2(dy,dx);
      } else {
        // movement rules
        let ang=Math.atan2(dy,dx);
        if(m.type==='wolf'){
          if(dd>d.range) {m.x+=Math.cos(ang)*m.speed*dt;m.y+=Math.sin(ang)*m.speed*dt}
          else {let side=Math.sin(time*3+m.x)*.6;m.x+=Math.cos(ang+side)*35*dt;m.y+=Math.sin(ang+side)*35*dt}
        } else if(m.type==='alpha'){
          if(dd>d.range+15){m.x+=Math.cos(ang)*m.speed*dt;m.y+=Math.sin(ang)*m.speed*dt}
        } else if(m.type==='stone'){
          if(dd>m.range*1.5){m.x+=Math.cos(ang)*m.speed*dt;m.y+=Math.sin(ang)*m.speed*dt}
        } else {
          if(dd>d.range*.8){m.x+=Math.cos(ang)*m.speed*dt;m.y+=Math.sin(ang)*m.speed*dt}
        }
        m.x=Math.max(40,Math.min(world.w-40,m.x));m.y=Math.max(40,Math.min(world.h-40,m.y));
      }
    }
  });
  if(p.hp<=0){p.hp=p.maxHp;toast('❤️ Александр потерял сознание и восстановился');p.x=540;p.y=1010}
}

 }
}

<script id="modern-pointer-multitouch">
const fingers = new Map();
const canvas = document.querySelector("canvas");

canvas.addEventListener("pointerdown", e => {
    fingers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });
});

canvas.addEventListener("pointermove", e => {
    const finger = fingers.get(e.pointerId);
    if (!finger) return;

    finger.x = e.clientX;
    finger.y = e.clientY;
});

canvas.addEventListener("pointerup", e => {
    fingers.delete(e.pointerId);
});

canvas.addEventListener("pointercancel", e => {
    fingers.delete(e.pointerId);
});
</script>

<script>
/* =========================
   BETA 17 — ALEXANDER ABILITIES
   ========================= */
const B17_KEY='alexander_rpg_beta17';
let B17=JSON.parse(localStorage.getItem(B17_KEY)||'null')||{
  level:0,xp:0,transformed:false,transformEnds:0,dimensionEnds:0
};
p.level=B17.level||p.level||0; p.xp=B17.xp||p.xp||0;

  const e=document.getElementById('b17Msg');e.textContent=t;e.style.display='block';
  clearTimeout(window._b17t);window._b17t=setTimeout(()=>e.style.display='none',1700);
}
const B17_AB=[
 {n:1,name:'Бросок камня',lvl:0,desc:'Александр бросает магический камень и грязь.'},
 {n:2,name:'Полёт',lvl:0,desc:'Александр летит по воздуху, создавая под собой камень и грязь.'},
 {n:3,name:'Вытаскивание куска земли',lvl:15,desc:'Под ближайшим врагом поднимается кусок земли.'},
 {n:4,name:'Каменная рука',lvl:30,desc:'Каменная рука хватает и бросает врагов; вокруг замедляется время.'},
 {n:5,name:'Каменный метеорит',lvl:50,desc:'Метеорит падает с неба и наносит урон по области.'},
 {n:6,name:'Метеоритный дождь',lvl:70,desc:'Небольшие метеориты падают вокруг Александра и поражают область.'},
 {n:7,name:'Трансформация',lvl:90,desc:'Броня исчезает, появляется прочная каменная кожа; Александр крупнее и медленнее. Длительность 5 минут.'},
 {n:8,name:'Измерение',lvl:120,desc:'Создаётся каменно-земляное измерение на 3 минуты. Доступно только при активной трансформации.'}
];
function b17Unlocked(a){return p.level>=a.lvl}
function b17OpenAbilities(){
  const box=document.getElementById('b17Abilities');
  box.innerHTML=B17_AB.map(a=>`<div class="b17Ability"><b>${a.n}. ${a.name}</b> — уровень ${a.lvl}<br>${a.desc}<br><button ${b17Unlocked(a)?'':'disabled'} onclick="b17Use(${a.n})">${b17Unlocked(a)?'Использовать':'🔒 Заблокировано'}</button></div>`).join('');
  document.getElementById('b17Panel').style.display='block';
}
function b17CloseAbilities(){document.getElementById('b17Panel').style.display='none'}
function b17Use(n){
 if(n===8) return window.alexDimensionMerged();

  if(!b17Unlocked(B17_AB[n-1]))return b17Toast('🔒 Недостаточный уровень');
  if(n===8 && !B17.transformed)return b17Toast('🪨 Сначала активируй Трансформацию');
  if(n===1)b17Rock();
  if(n===2)b17Fly();
  if(n===3)b17EarthLift();
  if(n===4)b17StoneHand();
  if(n===5)b17Meteor();
  if(n===6)b17MeteorRain();
  if(n===7)b17Transform();
  if(n===8)b17Dimension();
}
let b17Anim={type:null,t:0,duration:0,x:0,y:0};
function b17AnimStart(type,duration=.8,x=p.x,y=p.y){b17Anim={type,t:0,duration,x,y};}
function b17AnimDraw(){
 if(!b17Anim.type||b17Anim.t>=b17Anim.duration)return;
 const q=b17Anim.t/b17Anim.duration, x=b17Anim.x, y=b17Anim.y;
 ctx.save();
 if(b17Anim.type==='earth'){
   const rise=Math.sin(Math.min(1,q)*Math.PI)*65; ctx.globalAlpha=1-q*.3;
   poly([[x-38,y+28],[x-20,y-rise-20],[x+5,y-rise-48],[x+32,y-rise-15],[x+45,y+30]],'#756b58','#c9b58a');
 } else if(b17Anim.type==='meteor'){
   const sx=x+180,sy=y-260+q*260; ctx.globalAlpha=1-q*.2; circ(sx,sy,24,'#777c78','#d2d5d0');
   ctx.strokeStyle='#f0f0df99';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(sx-35,sy-55);ctx.lineTo(sx,sy);ctx.stroke();
 } else if(b17Anim.type==='rain'){
   ctx.globalAlpha=.75; for(let i=0;i<7;i++){let a=(i/7)*Math.PI*2+q*2;let r=55+((q*170+i*23)%170);let sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;circ(sx,sy,8,'#9b9f9b','#eee')}
 } else if(b17Anim.type==='hand'){
   const tx=b17HandTarget?.x??x+70,ty=b17HandTarget?.y??y;ctx.strokeStyle='#777c79';ctx.lineWidth=18;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(tx-x)*Math.min(1,q*2),y+(ty-y)*Math.min(1,q*2));ctx.stroke();
   for(let i=0;i<4;i++){let a=Math.PI*2*i/4;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(a)*22,ty+Math.sin(a)*22);ctx.stroke()}
 } else if(b17Anim.type==='transform'){
   ctx.globalAlpha=.18+.18*Math.sin(q*Math.PI*8);circ(x,y,42+q*12,'#7e8782','#d5dbd5');
 } else if(b17Anim.type==='dimension'){
   ctx.globalAlpha=.55*(1-q);ctx.strokeStyle='#c5c1a4';ctx.lineWidth=5;ctx.setLineDash([12,8]);ctx.strokeRect(x-190,y-130,380,260);ctx.setLineDash([]);
 }
 ctx.restore();
}

function b17NearestEnemy(){
  if(mobs && Array.isArray(mobs)){
    let best=null,d=1e9;
    for(const m of mobs){
      if(!m||m.dead)continue;
      const dx=(m.x||0)-p.x,dy=(m.y||0)-p.y,dd=Math.hypot(dx,dy);
      if(dd<d){d=dd;best=m}
    }
    return best;
  }
  return null;
}
function b17Damage(m,amount){
  if(!m)return;
  if(typeof m.hp==='number')m.hp-=amount;
  if(typeof m.health==='number')m.health-=amount;
  if(typeof m.takeDamage==='function')m.takeDamage(amount);
  if(m.hp<=0||m.health<=0)m.dead=true;
}
function b17Rock(){ const m=b17NearestEnemy(); b17AnimStart('meteor',.75,p.x,p.y); if(m)setTimeout(()=>b17Damage(m,28),350); b17Toast('🪨 Камень и грязь летят вперёд!'); }
function b17Fly(){window.b17Flying=!window.b17Flying;b17Toast(window.b17Flying?'🪽 Полёт включён':'🪽 Полёт выключен')}
function b17EarthLift(){const m=b17NearestEnemy(); if(m){b17AnimStart('earth',.9,m.x,m.y); setTimeout(()=>{if(!m.dead){m.y-=45;b17Damage(m,40)}},400)} else b17AnimStart('earth',.7,p.x+70,p.y); b17Toast('🌍 Земля поднялась под врагом')}
let b17HandTarget=null,b17HandX=0,b17HandY=0,b17HandVX=0,b17HandVY=0,b17HandPointer=null;
function b17StoneHand(){
  window.b17HandActive=true;
  b17HandX=p.x+85; b17HandY=p.y;
  b17HandVX=b17HandVY=0;
  document.getElementById('b17HandControls').style.display='flex';
  b17Toast('✋ Каменная рука активна — управляйте зоной руки');
  if(mobs)for(const m of mobs)if(m&&!m.dead)m._b17SlowUntil=Date.now()+300000;
}
const B17_HAND_HITBOX_RADIUS = 92;
function b17HandNearest(){
  // Explicit hand hitbox: the marked circle around the palm is the grab zone.
  let best=null,bestScore=Infinity;
  if(mobs)for(const m of mobs){
    if(!m||m.dead||m._b17Held)continue;
    const dx=(m.x||0)-b17HandX, dy=(m.y||0)-b17HandY;
    const d=Math.hypot(dx,dy);
    const mobRadius=Math.max(24, Number(m.r||m.radius||m.size||m.hitRadius||38));
    // Two circles touching = valid grab.
    const allowed=B17_HAND_HITBOX_RADIUS+mobRadius;
    if(d<=allowed){
      const score=d/Math.max(1,allowed);
      if(score<bestScore){bestScore=score;best=m}
    }
  }
  return best;
}
function b17Grab(){
  if(!window.b17HandActive)return b17Toast('Сначала активируйте Каменную руку');

  // Select the closest living mob inside the visible hand hitbox.
  let target=null, best=Infinity;
  const list=Array.isArray(mobs)?mobs:[];
  for(const m of list){
    if(!m || m.dead || m._b17Held) continue;
    const mx=Number(m.x), my=Number(m.y);
    if(!Number.isFinite(mx)||!Number.isFinite(my)) continue;

    const mobR=Math.max(20,Number(m.r||m.radius||m.size||m.hitRadius||35));
    const d=Math.hypot(mx-b17HandX,my-b17HandY);
    const allowed=B17_HAND_HITBOX_RADIUS+mobR;

    if(d<=allowed && d<best){
      best=d;
      target=m;
    }
  }

  if(!target){
    b17Toast('✊ Враг должен быть внутри жёлтой зоны захвата');
    return;
  }

  b17HandTarget=target;
  target._b17Held=true;
  target._b17GrabbedByStoneHand=true;
  target._b17GrabX=b17HandX;
  target._b17GrabY=b17HandY;
  b17Toast('✊ Враг схвачен!');
}
function b17Throw(){
  if(!b17HandTarget)return b17Toast('Нет схваченного врага');
  const m=b17HandTarget;
  const power=Math.max(120,Math.hypot(b17HandVX,b17HandVY));
  const len=Math.hypot(b17HandVX,b17HandVY)||1;
  const nx=b17HandVX/len, ny=b17HandVY/len;

  // Release the mob with real throw velocity. mobAI temporarily hands
  // control to this projectile motion instead of immediately steering it back.
  m._b17Held=false;
  m._b17GrabbedByStoneHand=false;
  m._b17ThrownUntil=performance.now()+Math.min(4200,900+power*5);
  m._b17ThrowVX=nx*power;
  m._b17ThrowVY=ny*power;
  m.x=b17HandX;
  m.y=b17HandY;
  b17HandTarget=null;

  b17Toast('💨 Враг брошен!');
}
function b17Meteor(){const m=b17NearestEnemy(); const x=m?.x??p.x,y=m?.y??p.y; b17AnimStart('meteor',1.0,x,y); setTimeout(()=>{if(m){b17Damage(m,90);if(mobs)for(const q of mobs)if(q!==m&&!q.dead&&Math.hypot((q.x||0)-x,(q.y||0)-y)<110)b17Damage(q,45)}},500); b17Toast('☄️ Каменный метеорит!')}
function b17MeteorRain(){
  b17AnimStart('rain',1.0,p.x,p.y);
  const end=Date.now()+10000;window.b17RainUntil=end;
  const tick=()=>{if(Date.now()>end)return;const m=b17NearestEnemy();if(m)b17Damage(m,24);setTimeout(tick,450)};tick();
  b17Toast('☄️ Начался метеоритный дождь');
}
function b17Transform(){
  b17AnimStart('transform',1.1,p.x,p.y);
  if(B17.transformed){B17.transformed=false;B17.transformEnds=0;b17Save();b17Toast('🪨 Трансформация выключена');return}
  B17.transformed=true;B17.transformEnds=Date.now()+300000;b17Save();b17Toast('🪨 Трансформация активна: сила ↑ скорость ↓');
}
function b17Dimension(){
  b17AnimStart('dimension',1.2,p.x,p.y);
  B17.dimensionEnds=Date.now()+180000;b17Save();
  const end=B17.dimensionEnds;
  const tick=()=>{if(Date.now()>end){b17Toast('🌌 Измерение исчезло');return}
    if(mobs)for(const m of mobs)if(m&&!m.dead)b17Damage(m,32);
    setTimeout(tick,350)
  };tick();b17Toast('🌌 Измерение создано на 3 минуты');
}
setInterval(()=>{if(B17.transformed&&Date.now()>B17.transformEnds){B17.transformed=false;b17Save();b17Toast('🪨 Трансформация завершилась') }},1000);

/* Unified XP: the game's real player state is authoritative. */
window.b17AddXP=function(v){addPlayerXP(v,'ability');};

/* Make the new ability bar easy to use without interfering with the tested controls. */
function b17BuildBar(){
  const bar=document.getElementById('b17Bar');
  bar.innerHTML=B17_AB.filter(a=>b17Unlocked(a)).map(a=>`<button title="${a.name}" onclick="b17Use(${a.n})">${a.n}</button>`).join('');
}
b17BuildBar();
setInterval(b17BuildBar,1500);
</script>

<script id="beta171-hand-fix">
(function(){
  const stick=document.getElementById('b17HandStick');
  if(!stick)return;
  function worldFromTouch(t){
    const r=stick.getBoundingClientRect();
    let nx=(t.clientX-(r.left+r.width/2))/(r.width/2);
    let ny=(t.clientY-(r.top+r.height/2))/(r.height/2);
    nx=Math.max(-1,Math.min(1,nx)); ny=Math.max(-1,Math.min(1,ny));
    const C=cam();
    const sx=W/2+nx*170, sy=H/2+ny*130;
    return {x:C.x+sx,y:C.y+sy};
  }
  stick.addEventListener('touchstart',function(e){
    if(!window.b17HandActive)return;
    const t=e.changedTouches[0]; b17HandPointer=t.identifier;
    const q=worldFromTouch(t); b17HandVX=(q.x-b17HandX)*8; b17HandVY=(q.y-b17HandY)*8;
    b17HandX=q.x;b17HandY=q.y;e.preventDefault();
  },{passive:false});
  stick.addEventListener('touchmove',function(e){
    if(b17HandPointer===null)return;
    for(const t of e.changedTouches)if(t.identifier===b17HandPointer){
      const q=worldFromTouch(t);
      b17HandVX=(q.x-b17HandX)*12;b17HandVY=(q.y-b17HandY)*12;
      b17HandX=q.x;b17HandY=q.y;
      e.preventDefault();break;
    }
  },{passive:false});
  function end(e){
    if(b17HandPointer===null)return;
    for(const t of e.changedTouches)if(t.identifier===b17HandPointer){b17HandPointer=null;break}
  }
  stick.addEventListener('touchend',end,{passive:true});
  stick.addEventListener('touchcancel',end,{passive:true});
})();

/* Keep a grabbed enemy attached to the hand and draw the hand until deactivated. */
const _oldB17AnimDraw = b17AnimDraw;
b17AnimDraw=function(){
  _oldB17AnimDraw();
  if(!window.b17HandActive)return;
  const x=p.x,y=p.y,tx=b17HandX,ty=b17HandY;
  ctx.save();
  ctx.strokeStyle='#777c79';ctx.lineWidth=20;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.strokeStyle='#aab0aa';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
  for(let i=0;i<5;i++){
    const a=-Math.PI/2+(i-2)*0.32;
    ctx.strokeStyle='#737a76';ctx.lineWidth=9;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(a)*30,ty+Math.sin(a)*30);ctx.stroke();
  }

  // DEBUG: visible grab hitbox. The circle follows the palm exactly.
  ctx.beginPath();
  ctx.arc(tx,ty,B17_HAND_HITBOX_RADIUS,0,Math.PI*2);
  ctx.fillStyle='rgba(255,215,0,0.12)';
  ctx.fill();
  ctx.strokeStyle='#ffd700';
  ctx.lineWidth=3;
  ctx.setLineDash([10,7]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ffd700';
  ctx.font='bold 13px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('ЗАХВАТ',tx,ty-B17_HAND_HITBOX_RADIUS-8);

  ctx.restore();
  if(b17HandTarget&&!b17HandTarget.dead){
    b17HandTarget.x=b17HandX;
    b17HandTarget.y=b17HandY-28;
    b17HandTarget.vx=0;
    b17HandTarget.vy=0;
    b17HandTarget._b17Held=true;
    b17HandTarget._b17GrabbedByStoneHand=true;
  }
};

/* Moving the player must not cancel the hand. The hand follows its own world position. */
setInterval(function(){
  if(window.b17HandActive){
    b17HandVX*=0.86;b17HandVY*=0.86;
    b17HandX=Math.max(40,Math.min(world.w-40,b17HandX+b17HandVX*0.016));
    b17HandY=Math.max(40,Math.min(world.h-40,b17HandY+b17HandVY*0.016));
  }
},16);
</script>


<script id="alex-dimension-merged">
(function(){
  // Completely isolated namespace. No touch listeners, movement handlers,
  // draw/update functions, or existing ability implementations are replaced.
  const DIM = {
    active:false,
    saved:null,
    timer:null,
    raf:null,
    particles:[],
    startedAt:0,
    duration:180000,
    W:2600,
    H:1800,
    CX:1300,
    CY:900
  };

  function notify(text){
    if(typeof b17Toast === "function") b17Toast(text);
  }

  function getNearbyEnemies(){
    if(!Array.isArray(window.mobs)) return [];
    return mobs.filter(m=>{
      if(!m || m.dead) return false;
      return Math.hypot((m.x||0)-(p.x||0),(m.y||0)-(p.y||0)) <= 350;
    });
  }

  function close(){
    if(!DIM.active) return;
    if(DIM.timer) clearInterval(DIM.timer);
    if(DIM.raf) cancelAnimationFrame(DIM.raf);
    DIM.timer=null;
    DIM.raf=null;

    if(DIM.saved){
      p.x=DIM.saved.px;
      p.y=DIM.saved.py;
      DIM.saved.enemies.forEach(e=>{
        if(e.m && !e.m.dead){
          e.m.x=e.x;
          e.m.y=e.y;
        }
        if(e.m){
          delete e.m._alexDimension;
          delete e.m._alexDimX;
          delete e.m._alexDimY;
        }
      });
    }

    DIM.particles=[];
    DIM.saved=null;
    DIM.active=false;
    notify("Измерение завершено");
  }

  function makeParticles(){
    DIM.particles=[];
    const count=170;
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2;
      const r=180+Math.random()*700;
      DIM.particles.push({
        a:a,
        r:r,
        speed:.35+Math.random()*1.1,
        size:2+Math.random()*5,
        phase:Math.random()*Math.PI*2
      });
    }
  }

  function createLocalPositions(enemies){
    enemies.forEach((m,i)=>{
      const a=i*2.399963;
      const r=170+(i%7)*95;
      m._alexDimension=true;
      m._alexDimX=DIM.CX+Math.cos(a)*r;
      m._alexDimY=DIM.CY+Math.sin(a)*r*.72;
    });
  }

  function enter(){
    if(DIM.active){
      close();
      return;
    }

    if(typeof B17 !== "undefined" && !B17.transformed){
      notify('для использования способности "измерение" вам нужно включить трансформацию');
      return;
    }

    const enemies=getNearbyEnemies();

    DIM.saved={
      px:p.x,
      py:p.y,
      enemies:enemies.map(m=>({m:m,x:m.x,y:m.y}))
    };

    // The normal-world coordinates are NOT changed on entry.
    // The dimension has its own coordinate system.
    createLocalPositions(enemies);
    makeParticles();

    DIM.active=true;
    DIM.startedAt=Date.now();

    DIM.timer=setInterval(()=>{
      if(!DIM.active) return;

      const live=mobs.filter(m=>m && !m.dead && m._alexDimension);
      if(!live.length){
        close();
        return;
      }

      // Visual debris preparation comes later; this timer intentionally only
      // maintains the dimension state so the visual scene can be tested safely.
      if(Date.now()-DIM.startedAt >= DIM.duration) close();
    },1000);

    notify("ИЗМЕРЕНИЕ ОТКРЫТО");
    /* display renderer disabled for green-screen diagnosis */
  }

  function render(){
    if(!DIM.active || !window.ctx || !window.canvas) return;

    const cw=canvas.width, ch=canvas.height;
    ctx.save();

    // Draw only in the existing game canvas; the DOM/UI and its touch handling
    // are not covered or replaced.
    /* DISPLAY FIX: do not clear/take over the main game canvas here. */

    const scale=Math.min(cw/DIM.W,ch/DIM.H);
    const ox=(cw-DIM.W*scale)/2;
    const oy=(ch-DIM.H*scale)/2;

    ctx.translate(ox,oy);
    ctx.scale(scale,scale);

    // Base visual inspired by the dimension effect from the latest build.
    const grad=ctx.createRadialGradient(DIM.CX,DIM.CY,50,DIM.CX,DIM.CY,1100);
    grad.addColorStop(0,"#c5b878");
    grad.addColorStop(.18,"#4d4939");
    grad.addColorStop(.58,"#1b1d17");
    grad.addColorStop(1,"#090a08");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,DIM.W,DIM.H);

    // Pixel/particle field: rotates around the central circle and gradually
    // spirals inward.
    const t=performance.now()/1000;
    for(const q of DIM.particles){
      q.a += q.speed*.006;
      q.r -= .22;
      if(q.r<75){
        q.r=620+Math.random()*420;
        q.a=Math.random()*Math.PI*2;
      }

      const pull=Math.max(0,1-(q.r/1050));
      const x=DIM.CX+Math.cos(q.a+t*q.speed*.18)*q.r;
      const y=DIM.CY+Math.sin(q.a+t*q.speed*.18)*q.r*.70;
      const s=q.size*(.65+pull*1.4);

      ctx.fillStyle = pull>.72 ? "#d8cf9a" : "#77705a";
      ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(s),Math.ceil(s));
    }

    // Central vortex.
    for(let i=7;i>=1;i--){
      ctx.beginPath();
      ctx.arc(DIM.CX,DIM.CY,42+i*18,0,Math.PI*2);
      ctx.strokeStyle=i%2 ? "#9d936b" : "#ded29a";
      ctx.globalAlpha=.08+i*.025;
      ctx.lineWidth=12;
      ctx.stroke();
    }
    ctx.globalAlpha=1;

    const core=ctx.createRadialGradient(DIM.CX,DIM.CY,2,DIM.CX,DIM.CY,95);
    core.addColorStop(0,"#050505");
    core.addColorStop(.55,"#17170f");
    core.addColorStop(1,"rgba(196,184,120,.04)");
    ctx.fillStyle=core;
    ctx.beginPath();
    ctx.arc(DIM.CX,DIM.CY,100,0,Math.PI*2);
    ctx.fill();

    // Dimension-local enemies.
    const live=mobs.filter(m=>m && !m.dead && m._alexDimension);
    for(const m of live){
      ctx.fillStyle="#aaa58e";
      ctx.strokeStyle="#eee4bc";
      ctx.lineWidth=5;
      ctx.beginPath();
      ctx.arc(m._alexDimX,m._alexDimY,30,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    // Alexander marker at the center.
    ctx.fillStyle="#d6c99a";
    ctx.strokeStyle="#fff0b8";
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.arc(DIM.CX,DIM.CY,38,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Subtle outer boundary.
    ctx.strokeStyle="#bcb184";
    ctx.lineWidth=9;
    ctx.setLineDash([30,18]);
    ctx.strokeRect(55,55,DIM.W-110,DIM.H-110);
    ctx.setLineDash([]);

    ctx.fillStyle="#eee6c8";
    ctx.textAlign="center";
    ctx.font="bold 26px sans-serif";
    ctx.fillText("ИЗМЕРЕНИЕ",DIM.CX,38);

    ctx.restore();

    DIM.raf=requestAnimationFrame(render);
  }

  window.alexDimensionMerged=enter;
})();
</script>

</body>
