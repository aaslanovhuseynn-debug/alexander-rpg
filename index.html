<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Александр — Beta 8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#rotate{position:fixed;inset:0;z-index:100;background:#090b12;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
#hud{position:fixed;z-index:20;left:12px;top:max(9px,env(safe-area-inset-top));font-size:13px;text-shadow:2px 2px #000}
.bar{width:170px;height:11px;border:1px solid #aaa;background:#111b;border-radius:3px;overflow:hidden}.fill{height:100%}.hp{background:#a82d3b}.xp{background:#a88a2b}
#title{position:fixed;z-index:20;right:12px;top:max(9px,env(safe-area-inset-top));padding:7px 10px;background:#090b12c9;border:1px solid #566070;border-radius:4px;font-size:12px}
#msg{position:fixed;z-index:20;left:50%;top:15%;transform:translateX(-50%);padding:7px 12px;background:#090b12dd;border:1px solid #566070;border-radius:4px;font-size:13px;pointer-events:none}
#joy{position:fixed;z-index:30;left:22px;bottom:clamp(22px,9vh,70px);width:126px;height:126px;border-radius:50%;background:#101722aa;border:2px solid #667080;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:#9aa4b044;border:2px solid #aab4c0;pointer-events:none}
.btn{position:fixed;z-index:30;width:78px;height:78px;border-radius:5px;border:2px solid #788391;color:#fff;font-size:27px;touch-action:none;box-shadow:0 3px 0 #05070a}
#attack{right:22px;bottom:clamp(35px,10vh,78px);background:#5a2028dd}
#earth{right:115px;bottom:clamp(25px,6vh,50px);background:#4b3b25dd}
#hint{position:fixed;z-index:20;right:205px;bottom:clamp(38px,8vh,65px);font-size:10px;background:#090b12b8;padding:5px;border:1px solid #566070}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">📱↔️<br><br><b>Поверни iPhone горизонтально</b><br><small>Тёмный pixel-art лес</small></div>
<div id="hud"><b>АЛЕКСАНДР · УР. 0</b><br>❤️ <div class="bar"><div id="hp" class="fill hp" style="width:100%"></div></div>⭐ <span id="xpText">0 / 100</span><div class="bar"><div id="xp" class="fill xp" style="width:0%"></div></div><span id="magic"></span></div>
<div id="title">🌲 ТЁМНЫЙ ЛЕС · BETA 8</div>
<div id="msg">🌑 Тёмный лес</div>
<div id="hint">⚔️ Волки и гоблины</div>
<div id="joy"><div id="knob"></div></div>
<button id="earth" class="btn">🪨</button>
<button id="attack" class="btn">⚔️</button>

<script>
(()=>{"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=0,H=0,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);document.getElementById("rotate").style.display=W>=H?"none":"flex"}
addEventListener("resize",resize);resize();

const P={x:0,y:0,hp:100}; let xp=0,awake=false,atk=0,earthCd=0;
const E=[
{t:"ВОЛК",x:250,y:-150,h:100,m:100,s:43,xp:10,a:1},
{t:"ВОЛК",x:-290,y:-210,h:100,m:100,s:43,xp:10,a:1},
{t:"ГОБЛИН",x:360,y:-330,h:70,m:70,s:52,xp:20,a:1},
{t:"ГОБЛИН",x:-400,y:-360,h:70,m:70,s:52,xp:20,a:1}
];

function say(s){let m=document.getElementById("msg");m.textContent=s;clearTimeout(say.t);say.t=setTimeout(()=>m.textContent="",2300)}
function gain(n){xp=Math.min(100,xp+n);document.getElementById("xp").style.width=xp+"%";document.getElementById("xpText").textContent=xp+" / 100"}
function near(r){let b=null,d0=r;for(const e of E)if(e.a){let d=Math.hypot(e.x-P.x,e.y-P.y);if(d<d0){d0=d;b=e}}return b}
function hit(){if(atk>0)return;atk=.35;let e=near(110);if(!e){say("Меч не достаёт до врага");return}e.h-=35;say("⚔️ Удар");if(e.h<=0){e.a=0;gain(e.xp);say("Победа! +"+e.xp+" XP");if(e.t==="ВОЛК"&&!awake){awake=1;document.getElementById("magic").textContent=" 🌍 Сила Земли пробудилась";document.getElementById("hint").textContent="🪨 Сила Земли доступна";say("🌍 Сила Земли пробудилась!");}}}
function rock(){if(!awake){say("Сила Земли ещё не пробудилась");return}if(earthCd>0)return;earthCd=.55;let e=near(260);if(!e){say("Нет врага рядом");return}e.h-=55;say("🪨 Камень попал");if(e.h<=0){e.a=0;gain(e.xp);say("Победа! +"+e.xp+" XP")}}
for(const id of ["attack","earth"]){document.getElementById(id).addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();id==="attack"?hit():rock()},{passive:false});document.getElementById(id).addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();id==="attack"?hit():rock()})}

const joy=document.getElementById("joy"),knob=document.getElementById("knob");let jid=null,mx=0,my=0;
function joySet(x,y){let r=joy.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),l=Math.hypot(dx,dy),m=45;if(l>m){dx=dx/l*m;dy=dy/l*m}mx=dx/m;my=dy/m;knob.style.left=38+dx+"px";knob.style.top=38+dy+"px"}
function joyStart(e){e.preventDefault();e.stopPropagation();let q=e.changedTouches?e.changedTouches[0]:e;jid=q.identifier??q.pointerId;joySet(q.clientX,q.clientY);say("🕹️")}
function joyMove(e){let q=e.changedTouches?e.changedTouches[0]:e;if(jid!==null&&(q.identifier??q.pointerId)===jid){e.preventDefault();joySet(q.clientX,q.clientY)}}
function joyEnd(){jid=null;mx=my=0;knob.style.left="38px";knob.style.top="38px"}
joy.addEventListener("touchstart",joyStart,{passive:false});joy.addEventListener("touchmove",joyMove,{passive:false});joy.addEventListener("touchend",joyEnd,{passive:false});
joy.addEventListener("pointerdown",joyStart);joy.addEventListener("pointermove",joyMove);joy.addEventListener("pointerup",joyEnd);joy.addEventListener("pointercancel",joyEnd);

let look=null,lx=0;
c.addEventListener("touchstart",e=>{let q=e.changedTouches[0];if(q.clientX>W*.4){look=q.identifier;lx=q.clientX;e.preventDefault()}},{passive:false});
c.addEventListener("touchmove",e=>{for(const q of e.changedTouches)if(q.identifier===look){e.preventDefault();lx=q.clientX}},{passive:false});

function update(dt){
atk=Math.max(0,atk-dt);earthCd=Math.max(0,earthCd-dt);
let speed=180,c=Math.cos(P.angle||0),s=Math.sin(P.angle||0);
P.x+=mx*speed*dt;P.y+=my*speed*dt;
for(const e of E)if(e.a){let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);if(d>55){e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt}else P.hp-=5*dt}
if(P.hp<=0){P.hp=100;P.x=P.y=0;say("Александр потерял сознание");}
document.getElementById("hp").style.width=P.hp+"%";
}

function screen(x,y){return{x:W/2+(x-P.x),y:H/2+(y-P.y)}}
function pixelTree(x,y,scale=1){
let q=screen(x,y);if(q.x<-80||q.x>W+80||q.y<-100||q.y>H+100)return;
ctx.fillStyle="#35251e";ctx.fillRect(q.x-7*scale,q.y-45*scale,14*scale,45*scale);
ctx.fillStyle="#152d23";ctx.fillRect(q.x-35*scale,q.y-85*scale,70*scale,35*scale);
ctx.fillStyle="#1c4430";ctx.fillRect(q.x-26*scale,q.y-105*scale,52*scale,30*scale);
ctx.fillStyle="#2d5a3b";ctx.fillRect(q.x-14*scale,q.y-118*scale,28*scale,22*scale);
}
function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#101a23";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#162d25";ctx.fillRect(0,H*.38,W,H*.62);
ctx.fillStyle="#203a2c";for(let y=0;y<H;y+=32){for(let x=0;x<W;x+=32){let n=((x*13+y*7)%19);if(n<4)ctx.fillRect(x+8,y+17,4,3)}}
for(let i=-7;i<=7;i++)for(let j=-5;j<=4;j++)pixelTree(i*155+(j%2)*50,j*150-230,1+(Math.abs(j)%2)*.15);

for(const e of E)if(e.a){let q=screen(e.x,e.y),col=e.t==="ВОЛК"?"#4b5360":"#55713f";if(q.x>-80&&q.x<W+80&&q.y>-80&&q.y<H+80){
ctx.fillStyle="#0008";ctx.fillRect(q.x-30,q.y-32,60,6);ctx.fillStyle="#a8323b";ctx.fillRect(q.x-30,q.y-32,60*(e.h/e.m),6);
ctx.fillStyle=col;ctx.fillRect(q.x-22,q.y-20,44,36);
ctx.fillStyle=e.t==="ВОЛК"?"#777f89":"#8da56b";ctx.fillRect(q.x-16,q.y-30,32,14);
ctx.fillStyle="#111";ctx.fillRect(q.x-10,q.y-26,5,5);ctx.fillRect(q.x+5,q.y-26,5,5);
ctx.fillStyle="#ddd";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText(e.t,q.x,q.y-39);
}}
ctx.fillStyle="#05070b66";ctx.fillRect(W/2-28,H/2+30,56,8);
ctx.fillStyle="#394f75";ctx.fillRect(W/2-18,H/2-27,36,50);
ctx.fillStyle="#c18b68";ctx.fillRect(W/2-13,H/2-46,26,20);
ctx.fillStyle="#111827";ctx.fillRect(W/2-17,H/2-51,34,9);
ctx.fillStyle="#d6dbe3";ctx.fillRect(W/2+18,H/2-20,5,42);
if(atk>0){ctx.strokeStyle="#f0e5c8";ctx.lineWidth=6;ctx.beginPath();ctx.arc(W/2+8,H/2-4,48,-1.1,0.9);ctx.stroke();}
ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillText("АЛЕКСАНДР",W/2,H/2-57);
}
let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>

<style>
/* Alexander RPG — Beta 9 systems layer */
#b9-ui{position:fixed;inset:0;pointer-events:none;z-index:9999;font-family:Arial,sans-serif;color:#fff}
#b9-hud{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.62);padding:9px 12px;border:1px solid rgba(255,255,255,.25);border-radius:8px;line-height:1.45;font-size:14px;min-width:175px}
#b9-hud .muted{opacity:.72;font-size:12px}
#b9-toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:20px;font-weight:700;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .18s,transform .55s}
#b9-toast.show{opacity:1;transform:translate(-50%,-75%)}
#b9-controls{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:300px;pointer-events:auto}
.b9-btn{border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.78);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700}
#b9-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,15,12,.96);border:2px solid #b99a58;border-radius:12px;padding:20px;min-width:290px;max-width:90vw;display:none;pointer-events:auto;box-shadow:0 12px 50px #000}
#b9-panel.show{display:block}
#b9-panel h2{margin:0 0 12px}
#b9-panel button{margin:5px 0;padding:9px 12px;width:100%}
#b9-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 10px;border-radius:8px;font-size:12px;opacity:.9}
</style>
<div id="b9-ui">
  <div id="b9-hud">
    <div><b>Уровень:</b> <span id="b9-level">0</span></div>
    <div><b>XP:</b> <span id="b9-xp">0</span> / <span id="b9-next">100</span></div>
    <div><b>Ресурсы:</b> <span id="b9-dirt">0</span>🟫, <span id="b9-stone">0</span>🪨 / <span id="b9-cap">20</span></div>
    <div class="muted">Мешок: <span id="b9-bag">Маленький</span></div>
  </div>
  <div id="b9-toast"></div>
  <div id="b9-controls">
    <button class="b9-btn" id="b9-move">🌀 Полёт</button>
    <button class="b9-btn" id="b9-rock">🪨 Бросок камня</button>
    <button class="b9-btn" id="b9-pick">⛏️ Кирка</button>
    <button class="b9-btn" id="b9-castle">🏰 Замок</button>
    <button class="b9-btn" id="b9-mine">⛏️ Шахта</button>
  </div>
  <div id="b9-panel"></div>
  <div id="b9-hint">Beta 9: нажми «Шахта» для теста добычи или «Замок» для королевской зоны.</div>
</div>
<script>
(() => {
  const S = {
    level:0, xp:0, dirt:0, stone:0, bag:"Маленький", cap:20,
    flying:false, location:"Лес",
    bags:{
      "Маленький":{cap:20,color:"brown",price:0},
      "Средний":{cap:30,color:"white",price:500},
      "Большой":{cap:50,color:"maroon",price:777},
      "Очень большой":{cap:80,color:"lime",price:1000},
      "Гигантский":{cap:150,color:"gold",price:1500}
    }
  };

  const $ = id => document.getElementById(id);
  const hud = () => {
    $("b9-level").textContent=S.level;
    $("b9-xp").textContent=Math.floor(S.xp*10)/10;
    $("b9-next").textContent=100 + S.level*10;
    $("b9-dirt").textContent=Math.floor(S.dirt*10)/10;
    $("b9-stone").textContent=Math.floor(S.stone*10)/10;
    $("b9-cap").textContent=S.cap;
    $("b9-bag").textContent=S.bag;
  };
  function toast(t){
    const e=$("b9-toast"); e.textContent=t; e.classList.remove("show");
    void e.offsetWidth; e.classList.add("show");
    setTimeout(()=>e.classList.remove("show"),1300);
  }
  function gainResource(type,n){
    const total=S.dirt+S.stone;
    const room=Math.max(0,S.cap-total);
    const add=Math.min(n,room);
    S[type]+=add;
    toast(add<n ? `🎒 Мешок заполнен: +${add}${type==="stone"?"🪨":"🟫"}` : `+${add}${type==="stone"?"🪨":"🟫"}`);
    hud();
  }
  function spend(dirt,stone,label){
    if(S.dirt<dirt || S.stone<stone){ toast("⚠️ Недостаточно 🟫/🪨"); return false; }
    S.dirt-=dirt; S.stone-=stone;
    toast(`-${dirt}🟫, -${stone}🪨`);
    hud(); return true;
  }
  function mine(type){
    const r=Math.random(), n=r<.65?1:r<.90?2:3;
    toast("⛏️ Удар! Осталось ударов: 0");
    setTimeout(()=>toast(n===1?"Маленький кусок":n===2?"Средний кусок":"Большой кусок"),350);
    setTimeout(()=>gainResource(type,n),700);
  }
  $("b9-pick").onclick=()=>mine(Math.random()<.5?"stone":"dirt");
  $("b9-rock").onclick=()=>{ if(spend(1,1,"rock")) toast("🪨 Камень брошен!"); };
  let flyTimer=null;
  $("b9-move").onclick=()=>{
    if(S.flying){S.flying=false; clearInterval(flyTimer); toast("🌀 Полёт отключён"); return;}
    if(S.dirt<.5 || S.stone<.5){toast("⚠️ Недостаточно ресурсов для полёта");return;}
    S.flying=true; toast("🌀 Полёт включён");
    flyTimer=setInterval(()=>{
      if(!S.flying)return;
      if(!spend(.5,.5,"fly")){
        S.flying=false; clearInterval(flyTimer); toast("⚠️ Ресурс закончился — Александр падает");
      }
    },1000);
  };

  const panel=$("b9-panel");
  function openPanel(title,body){
    panel.innerHTML="<h2>"+title+"</h2>"+body+'<button id="b9-close">Закрыть</button>';
    panel.classList.add("show"); $("b9-close").onclick=()=>panel.classList.remove("show");
  }
  $("b9-castle").onclick=()=>openPanel("🏰 Королевский замок",
    "<p>Высокая просторная королевская постройка, мрамор, золотая крыша, большие окна и мраморные ступени.</p>"+
    "<p><b>Тронный зал:</b> красный ковёр ведёт к возвышению с королевским креслом. Рядом стоят гвардейцы с копьями.</p>"+
    "<p>Здесь позже будет полноценная сцена разговора Александра с королём.</p>");
  $("b9-mine").onclick=()=>openPanel("⛏️ Шахта",
    "<p>Зона тестирования добычи камня и грязи.</p>"+
    "<p>Размер куска: маленький 65%, средний 25%, большой 10%.</p>"+
    "<p>Нажми «Кирка», чтобы получить ресурс в текущий мешок.</p>");

  hud();
})();
</script>

</body>
</html>
